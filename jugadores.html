<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Personaje D&D</title>
<style>
:root{--bg:#0f1117;--s1:#1a1d27;--s2:#222635;--ink:#e8e9ed;--ink2:#9ca0af;--ink3:#6b7084;--brd:#2d3143;--acc:#60a5fa;--red:#f87171;--amb:#fbbf24;--grn:#4ade80}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
::selection{background:var(--acc);color:var(--bg)}
.app{max-width:520px;margin:0 auto;padding:0 0 80px}
.pick{padding:20px 16px}
.pick h1{font-size:1.3rem;font-weight:700;color:var(--acc);text-align:center;margin-bottom:2px}
.pick .sub{font-size:.78rem;color:var(--ink3);text-align:center;margin-bottom:20px}
.grp{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);padding:14px 0 8px;border-bottom:1px solid var(--brd)}
.pc{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;margin:5px 0;background:var(--s1);border:1px solid var(--brd);border-radius:10px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:all .15s;-webkit-tap-highlight-color:transparent;animation:fadeUp .3s ease both}
.pc:active{border-color:var(--acc);transform:scale(.98)}
.pc .lf{flex:1;min-width:0}
.pc .nm{font-size:.95rem;font-weight:600}
.pc .ti{font-size:.78rem;color:var(--ink2)}
.pc .rc{font-size:.7rem;color:var(--ink3)}
.pc .ri{text-align:right;font-size:.78rem;color:var(--ink3);flex-shrink:0;margin-left:12px}
.exp-b{font-size:.6rem;font-weight:700;background:rgba(251,191,36,.1);color:var(--amb);border:1px solid rgba(251,191,36,.2);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.back{display:block;background:none;border:none;color:var(--ink3);font-size:.85rem;cursor:pointer;padding:12px 16px;font-family:inherit;-webkit-tap-highlight-color:transparent}
.back:active{color:var(--acc)}
.sh{padding:0 16px}
.sh .nm2{font-size:1.4rem;font-weight:700;margin-bottom:1px}
.sh .ti2{font-size:.9rem;color:var(--ink2);margin-bottom:1px}
.sh .me2{font-size:.78rem;color:var(--ink3);margin-bottom:14px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--brd);margin:0 16px 12px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px}
.tabs button{flex:1;padding:10px 4px;border:none;background:none;color:var(--ink3);font-size:.88rem;font-weight:500;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;-webkit-tap-highlight-color:transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.cnt{padding:0 16px}
.qs{background:var(--s2);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:14px;font-size:.84rem;line-height:1.6}
.qs b{display:block;font-size:.7rem;color:var(--ink3);font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.hprow{display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:8px}
.hprow .lb{font-size:.85rem;color:var(--ink2);width:24px}
.hprow .vl{font-size:1.6rem;font-weight:700;min-width:50px;text-align:center}
.hprow .mx{font-size:.78rem;color:var(--ink3)}
.b1{width:38px;height:38px;border-radius:8px;border:1px solid var(--brd);background:var(--s1);color:var(--ink);font-size:1.2rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:all .1s}
.b1:active{background:var(--s2);border-color:var(--acc)}
.bsm{width:24px;height:24px;border-radius:6px;border:1px solid var(--brd);background:var(--s1);color:var(--ink);font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;-webkit-tap-highlight-color:transparent}
.bsm:active{background:var(--s2)}
.bt{border:1px solid var(--brd);background:var(--s2);color:var(--ink2);padding:4px 10px;border-radius:6px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.bt:active{border-color:var(--acc);color:var(--acc)}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0;text-align:center}
.si{background:var(--s1);border:1px solid var(--brd);border-radius:8px;padding:6px 2px}
.si .sl{font-size:.6rem;font-weight:700;color:var(--ink3)}.si .sv{font-size:1.15rem;font-weight:700}.si .sm{font-size:.78rem;color:var(--ink2)}
.i3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}
.i3 div{background:var(--s1);border:1px solid var(--brd);border-radius:8px;padding:8px 10px}
.i3 .il{font-size:.65rem;font-weight:700;color:var(--ink3)}.i3 .iv{font-size:1rem;font-weight:700}.i3 .id{font-size:.65rem;color:var(--ink3)}
.skl{font-size:.8rem;color:var(--ink2);margin:6px 0;line-height:1.5}
.sn{font-size:.68rem;color:var(--ink3);margin-bottom:10px}
.sec{border-top:1px solid var(--brd);margin-top:6px}
.sec summary{padding:12px 0;font-size:.9rem;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;-webkit-tap-highlight-color:transparent}
.sec summary::-webkit-details-marker{display:none}
.sec summary::after{content:"▼";font-size:.6rem;color:var(--ink3)}
.sec[open] summary::after{content:"▲"}
.sec .bd{padding:0 0 12px;font-size:.82rem;color:var(--ink2);line-height:1.6}
.atkr{padding:8px 0;border-bottom:1px solid #1f2233}
.atkr:last-child{border:none}
.atkr .rw{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:.85rem}
.atkr .rw b{color:var(--ink)}
.atkr .nt{font-size:.72rem;color:var(--ink3);margin-top:2px}
.slt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;margin-bottom:8px}
.slg{display:flex;align-items:center;gap:4px}
.slg .ll{font-size:.72rem;color:var(--ink3);font-weight:600}
.dot{width:28px;height:28px;border-radius:14px;border:2px solid var(--brd);background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--ink3);font-family:inherit;-webkit-tap-highlight-color:transparent;transition:all .1s}
.dot.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.spcat{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin:10px 0 4px}
.spl{font-size:.8rem;padding:3px 0;line-height:1.55;color:var(--ink2)}
.ft{padding:8px 0;border-bottom:1px solid #1f2233}
.ft:last-child{border:none}
.ft .fn{font-size:.85rem;font-weight:600;color:var(--ink)}
.ft .fd{font-size:.78rem;color:var(--ink2);line-height:1.55;white-space:pre-line}
.uses{display:inline-flex;align-items:center;gap:3px;margin-left:8px;vertical-align:middle}
.uv{font-size:.8rem;font-weight:700}
.cn{padding:8px 0;border-bottom:1px solid #1f2233}
.cn:last-child{border:none}
.cn .cnn{font-size:.85rem;font-weight:600;color:var(--ink)}
.cn .cnd{font-size:.78rem;color:var(--ink2);margin-top:2px}
.cn .cna{font-size:.75rem;color:var(--acc);margin-top:2px}
.rpq{font-size:.95rem;font-style:italic;color:var(--ink2);line-height:1.6;margin-bottom:10px}
.rpd{font-size:.82rem;color:var(--ink2);line-height:1.6;margin-bottom:8px}
.rpe{font-size:.78rem;color:var(--ink3)}
.ref .sec{border-top:1px solid var(--brd)}
.ref .bd{white-space:pre-line}
.tag{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head><body>
<div class="app" id="app"></div>
<script>
var SN=["FUE","DES","CON","INT","SAB","CAR"];
var C=[
{s:2,n:"Aldric",t:"El Caballero Caido",r:"Humano",c:"Paladin 3",su:"Juramento de Devocion",st:[16,10,14,8,12,15],hp:28,ac:19,spd:30,pr:2,acd:"Mallas+escudo+Defensa",sv:["SAB +3","CAR +4"],sk:["Atletismo +5","Intimidacion +4","Persuasion +4"],q:"Ataca con espada larga (+5, 1d8+3). Si aciertas, puedes gastar un ESPACIO DE CONJURO para Castigo Divino (marca el espacio y suma +2d8 radiante). Aliado herido: Imposicion de Manos (gasta puntos de tu reserva de 15). Canalizar Divinidad puede cambiar el curso de un encuentro.",at:[{n:"Espada larga",h:"+5",d:"1d8+3",t:"Cuerpo a cuerpo"},{n:"Jabalina x5",h:"+5",d:"1d6+3",t:"30/120 pies"}],sp:{dc:12,ak:"+4",sl:[3],ca:[],al:["Proteccion vs Mal y Bien - conc, protege de aberraciones/celestiales/elementales/demonios/no-muertos","Santuario - acc.bonus, atacantes SAB CD12 o eligen otro"],pr:["Curar Heridas - toca, 1d8+2 PG","Escudo de Fe - acc.bonus, +2 CA, concentracion","Castigo Marcante - acc.bonus; al golpear +1d6 psiquico, SAB 12 o asustado"]},fe:[{n:"Sentido Divino",d:"Accion. Detecta celestiales, demonios y no-muertos en 60 pies.",u:3},{n:"Imposicion de Manos",d:"Accion. Toca y gasta los puntos que quieras de tu reserva para curar esa cantidad de PG. 5 puntos curan enfermedad/veneno. Se recarga en descanso largo.",p:15},{n:"Castigo Divino",d:"Al golpear cuerpo a cuerpo, gasta un ESPACIO DE CONJURO (marcalo): +2d8 radiante (nv1) o +3d8 (nv2). Vs no-muertos o demonios: +1d8 extra. Se decide DESPUES de acertar."},{n:"Arma Sagrada",d:"Accion + Canalizar Divinidad. 1/desc.corto. 1 min: +2 a tiradas de ataque con tu arma.",u:1},{n:"Expulsar Impios",d:"Accion. No-muertos y demonios en 30 pies: SAB CD12 o huyen 1 min. Comparte uso con Arma Sagrada."},{n:"Defensa",d:"+1 CA con armadura (incluido en CA 19)."}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion: beber o dar a adyacente."},{n:"Agua Bendita (un solo uso)",d:"2d6 de dano radiante a no-muertos y demonios. Lanzable.",a:"Accion: ataque a distancia improvisado (20 pies)."}],eq:"Cota de mallas, escudo, espada larga, 5 jabalinas, simbolo sagrado.",qu:"Jure proteger a los inocentes. Frace una vez. No volvera a pasar.",rp:"Sirvio a un senor tirano. Desterrado por negarse a ejecutar prisioneros. Busca redencion. Serio pero amable."},
{s:2,n:"Grimjaw",t:"El Cazador de Monstruos",r:"Humano variante",c:"Explorador 3",su:"Cazador - Asesino de Hordas",st:[13,16,14,10,14,8],hp:28,ac:15,spd:30,pr:2,acd:"Cuero tachonado",sv:["FUE +3","DES +5"],sk:["Supervivencia +4","Percepcion +4","Sigilo +5","Investigacion +2","Naturaleza +2"],q:"Dispara con arco largo (+7, 1d8+3). Turno 1: lanza Marca del Cazador como accion bonus (+1d6 a cada impacto contra ese objetivo, CONCENTRACION). Si hay dos enemigos juntos: Asesino de Hordas te da un ataque extra al segundo.",at:[{n:"Arco largo",h:"+7",d:"1d8+3",t:"150/600 pies"},{n:"Espada corta x2",h:"+5",d:"1d6+3",t:"Cuerpo a cuerpo"}],sp:{dc:12,ak:"+4",sl:[3],ca:[],al:[],pr:["Marca del Cazador - acc.bonus, CONCENTRACION (si dano: CON CD10 o pierdes). +1d6 por impacto. Si muere: mueves marca","Curar Heridas - toca, 1d8+2 PG","Buenas Bayas - 10 bayas: cada una cura 1 PG y alimenta 1 dia"]},fe:[{n:"Alerta (dote)",d:"+5 iniciativa. No puedes ser sorprendido."},{n:"Enemigo Predilecto: No-muertos",d:"Ventaja en Supervivencia para rastrear y en INT para recordar informacion."},{n:"Terreno Predilecto: Bosque",d:"Ventaja en INT/SAB en bosque. No te pierdes. Comida para el doble."},{n:"Tiro con Arco",d:"+2 a ataques a distancia (incluido en arco)."},{n:"Asesino de Hordas",d:"1 vez por turno: al atacar, puedes hacer un ataque adicional con la misma arma contra otra criatura a 5 pies del primer objetivo."}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion: beber."},{n:"Antitoxina (un solo uso)",d:"Ventaja en salvaciones contra veneno durante 1 hora.",a:"Accion: beber."},{n:"Flechas de Plata x3",d:"Superan la resistencia al dano de licantropos y ciertos no-muertos.",a:"Ataque normal de arco."}],eq:"Arco largo, 2 espadas cortas, cuero tachonado, 20 flechas, trampa de caza.",qu:"He visto lo que hay en la oscuridad. La oscuridad deberia tener miedo.",rp:"Perdio su pueblo natal hace anos. Desde entonces viaja solo, rastreando amenazas en la frontera. Parco en palabras, observador. Huele el aire antes de entrar a cualquier sitio."},
{s:2,n:"Lira",t:"La Barda Investigadora",r:"Mediana Piesligeros",c:"Barda 3",su:"Colegio del Saber",st:[8,15,12,14,13,16],hp:21,ac:14,spd:25,pr:2,acd:"Cuero tachonado",sv:["DES +4","CAR +5"],sk:["Investigacion +6*","Persuasion +7*","Perspicacia +3","Engano +5","Historia +4","Interpretacion +5","Percepcion +3","Sigilo +4","Arcanos +4","Religion +4","Naturaleza +4"],q:"Quedate atras. Usa Burla Cruel para danar y debilitar enemigos (1d4 + desventaja). Reparte Inspiracion Bardica (acc.bonus, d6 a un aliado). Cura con Palabra Sanadora (acc.bonus, 60 pies). Si la cosa se tuerce: Dormir.",at:[{n:"Rapier",h:"+4",d:"1d8+2",t:"CaC sutil"},{n:"Daga",h:"+4",d:"1d4+2",t:"20/60 pies"}],sp:{dc:13,ak:"+5",sl:[4,2],ca:["Burla Cruel - 60 pies, SAB CD13, 1d4 psiquico + desventaja en proximo ataque","Mano de Mago - mano invisible, manipula objetos a 30 pies"],al:[],pr:["Curar Heridas - toca, 1d8+3 PG","Detectar Magia - conc, ritual, magia en 30 pies","Dormir - 5d8 PG de criaturas se duermen (empieza por menos PG)","Palabra Sanadora - ACC.BONUS, 60 pies, 1d4+3 PG","Encanto de Personas - SAB CD13, te considera amigo 1 hora","Luz de Hadas (nv2) - conc, criaturas brillan, ataques con ventaja, no invisibles"]},fe:[{n:"Suerte Halfling",d:"Si sacas 1 natural en ataque/habilidad/salvacion, puedes volver a tirar."},{n:"Valiente",d:"Ventaja en salvaciones contra asustado."},{n:"Inspiracion Bardica d6",d:"Acc.bonus. Aliado en 60 pies recibe d6 para sumar a un ataque, salvacion o prueba. Dura 10 minutos.",u:3},{n:"Cancion de Descanso",d:"En descanso corto, aliados que gasten dados de golpe recuperan 1d6 PG extra."},{n:"Touche",d:"+1 a toda prueba de habilidad sin competencia (ya incluido)."},{n:"Cortar Palabras",d:"Reaccion. Cuando enemigo en 60 pies hace ataque/dano/prueba: gastas UNO de tus usos de Inspiracion (del mismo contador de 3) y restas 1d6 al resultado."}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion: beber."},{n:"Pergamino de Detectar Pensamientos (un solo uso)",d:"Lees pensamientos superficiales en 30 pies. SAB CD13 para sondear mas profundo. Concentracion 1 min.",a:"Accion: leer el pergamino (se consume)."}],eq:"Rapier, daga, cuero tachonado, laud, lupa, cuaderno de notas.",qu:"Cada monstruo tiene una historia. Solo hay que saber escuchar.",rp:"Ex cronista que descubrio la corrupcion de su mentor. Viaja recopilando historias de lugares olvidados. Curiosa hasta lo peligroso, empatica."},
{s:2,n:"Theron",t:"El Druida del Bosque Quemado",r:"Elfo del Bosque",c:"Druida 3",su:"Circulo de la Luna",st:[10,14,13,12,16,8],hp:21,ac:15,spd:35,pr:2,acd:"Cuero+escudo madera",sv:["INT +3","SAB +5"],sk:["Percepcion +5","Naturaleza +3","Medicina +5","Supervivencia +5","Religion +3"],q:"Transformate en Oso Pardo como ACCION BONUS: 34 PG extra con multiataque. NO puedes lanzar conjuros como animal. Si caes a 0 como animal, vuelves a tu forma con tus PG intactos. Fuera de forma animal: Producir Llama para dano a distancia.",at:[{n:"Cimitarra",h:"+4",d:"1d6+2",t:"Cuerpo a cuerpo"},{n:"Producir Llama",h:"+5",d:"1d8 fuego",t:"30 pies, truco"}],sp:{dc:13,ak:"+5",sl:[4,2],ca:["Druidcraft - efectos naturales menores (predecir clima, abrir flores)","Producir Llama - creas fuego en tu mano: +5 ataque, 1d8 fuego, 30 pies; ilumina"],al:[],pr:["Curar Heridas - toca, 1d8+3 PG","Hablar con Animales - ritual, entiendes y hablas con animales 10 min","Ola Atronadora - criaturas en 15 pies: CON CD13, 2d8 trueno + empujadas 10 pies","Detectar Magia - concentracion, ritual, magia en 30 pies","Piel de Corteza (nv2) - concentracion, tu CA es 16 durante 1 hora","Pasar sin Rastro (nv2) - concentracion, tu y aliados en 30 pies: +10 a Sigilo"]},fe:[{n:"Vision en la Oscuridad",d:"60 pies."},{n:"Mascara de lo Salvaje",d:"Puedes esconderte estando ligeramente oculto por vegetacion, lluvia, niebla."},{n:"Forma Salvaje",d:"ACCION BONUS. Bestia CR 1 o menos, 1 hora. Adoptas sus PG. Si caes a 0 vuelves con tus PG.\n\nNO puedes lanzar conjuros como animal.\n\nPuedes gastar un espacio de conjuro como accion para recuperar 1d8 PG por nivel del espacio.",u:2},{n:"Oso Pardo",d:"CA 11 - PG 34 - Multiataque: Garras +5 (2d6+4) + Mordisco +5 (1d8+4)"},{n:"Lobo Dire",d:"CA 14 - PG 37 - Mordisco +5 (2d6+3). Impacto: FUE CD13 o derribado."}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion: beber."},{n:"Pocion de Amistad con Animales (un solo uso)",d:"Una bestia en 30 pies debe superar SAB CD13 o queda encantada 24 horas.",a:"Accion: beber."}],eq:"Cimitarra, escudo de madera, cuero, foco druidico (baston), kit de herbolario.",qu:"La naturaleza no es amable ni cruel. Simplemente es.",rp:"Protegua un bosque sagrado hasta que fue arrasado. Desde entonces vaga buscando un nuevo proposito. Habla mas con animales que con personas. Ferozmente leal."},
{s:2,n:"Nyx",t:"El Sabueso",r:"Humano variante",c:"Picaro 3",su:"Ladron",st:[8,16,14,10,14,12],hp:24,ac:15,spd:30,pr:2,acd:"Cuero tachonado (12+3)",sv:["DES +5","INT +2"],sk:["Sigilo +7*","Perspicacia +6*","Percepcion +4","Acrobacia +5","Juego de Manos +5","Engano +3"],q:"Escondete con Accion Astuta (acc.bonus). Ataca con ventaja: espada corta +5, 1d6+3 + 2d6 Furtivo. Manos Rapidas: usa objetos como acc.bonus (pociones, trampa, bolas). Afortunado: 3/dia repite un d20. Perspicacia +6 para cazar mentiras.",at:[{n:"Espada corta",h:"+5",d:"1d6+3+2d6 furtivo",t:"Sutil"},{n:"Daga x2",h:"+5",d:"1d4+3+2d6 furtivo",t:"20/60 pies"},{n:"Arco corto",h:"+5",d:"1d6+3+2d6 furtivo",t:"80/320 pies"}],fe:[{n:"Afortunado (dote)",d:"3 veces por descanso largo: cuando haces ataque, salvacion o prueba, puedes tirar un d20 adicional y elegir cual usar. Tambien cuando un enemigo te ataca.",u:3},{n:"Ataque Furtivo 2d6",d:"1 vez por turno: +2d6 si tienes ventaja O un aliado a 5 pies del objetivo. Solo armas de sutileza o a distancia."},{n:"Accion Astuta",d:"Acc.bonus: Dash (doble movimiento), Desenganche (sin ataques de oportunidad) o Esconderse."},{n:"Manos Rapidas",d:"Acc.bonus: usar objeto, herramientas de ladron, o Juego de Manos. Puedes beber pociones o colocar trampas como acc.bonus."},{n:"Trepar a Toda Velocidad",d:"Trepar no cuesta movimiento extra. Salto en carrera +3 pies."},{n:"Jerga de Ladrones",d:"Lenguaje secreto entre criminales. Mensajes ocultos en conversacion."}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion (o acc.bonus con Manos Rapidas): beber."},{n:"Trampa de Caza (reutilizable)",d:"Criatura pisa: 1d4 perforante + restringida. FUE/Acrobacia CD13 escapar.",a:"Accion (o acc.bonus con Manos Rapidas): colocar."},{n:"Bolas de Acero (un solo uso)",d:"Cubren 10 pies. Criaturas que crucen: DES CD10 o caen prono.",a:"Accion (o acc.bonus con Manos Rapidas): esparcir."}],eq:"Espada corta, 2 dagas, arco corto, 20 flechas, cuero tachonado, herramientas de ladron, trampa de caza, bolas de acero, cuerda 50 pies.",qu:"La verdad no se encuentra. Se roba.",rp:"Lleva semanas en Pantanovago investigando al Baron. Vio los moratones de Mila antes de que desapareciera. Nadie le creyo. Los aventureros son su oportunidad."},
{s:3,n:"Vex",t:"El Clerigo de los Olvidados",r:"Tiefling",c:"Clerigo 5",su:"Dominio de la Vida",ex:1,st:[10,12,14,9,16,16],hp:38,ac:18,spd:30,pr:3,acd:"Mallas+escudo",sv:["SAB +6","CAR +6"],sk:["Perspicacia +6","Persuasion +6","Medicina +6","Engano +6"],q:"Turno 1: Espiritus Guardianes (concentracion, 3d8 radiante a enemigos en 15 pies) + Arma Espiritual como acc.bonus (1d8+3 fuerza, sin concentracion). Mueve Arma Espiritual cada turno con acc.bonus. Para curar: Palabra Sanadora (acc.bonus, 60 pies, 1d4+6 PG). Curacion masiva: Preservar Vida (25 PG repartidos). Si te danan: Represalia Infernal (reaccion, 3d10 fuego).",at:[{n:"Maza",h:"+3",d:"1d6 contundente",t:"Cuerpo a cuerpo"},{n:"Llama Sagrada (truco)",h:"DES CD14",d:"2d8 radiante",t:"60 pies, ignora cobertura"}],sp:{dc:14,ak:"+6",sl:[4,3,2],ca:["Llama Sagrada - DES CD14, 2d8 radiante, 60 pies, ignora cobertura","Reposo Eterno - toque, estabiliza a criatura a 0 PG (no gasta espacio)","Guia - toque, concentracion, +1d4 a una prueba de habilidad","Resistencia - toque, concentracion, +1d4 a una salvacion","Taumaturgia (racial) - efectos dramaticos: voz amplificada, ojos rojos, puertas"],al:["Bendicion - conc, 3 criaturas +1d4 a ataques y salvaciones, 1 min","Curar Heridas - toca, 1d8+6 PG (Discipulo incluido). Nv2: 2d8+7. Nv3: 3d8+8","Restauracion Menor (nv2) - toca, cura enfermedad, ceguera, sordera, paralisis o veneno","Arma Espiritual (nv2) - ACC.BONUS, crea arma flotante 1d8+3 fuerza, acc.bonus para atacar cada turno, SIN concentracion","Faro de Esperanza (nv3) - conc, 10 min, aliados en 30 pies: ventaja en SAB y salvaciones de muerte, curaciones al maximo","Revivificar (nv3) - 1 accion, toca criatura muerta hace menos de 1 min, vuelve con 1 PG. Componente: diamante 300mo"],pr:["Rayo Guia - +6, 4d6 radiante + siguiente ataque contra objetivo con ventaja","Palabra Sanadora - ACC.BONUS, 60 pies, 1d4+6 PG (Discipulo incluido)","Escudo de Fe - acc.bonus, +2 CA a aliado, concentracion","Santuario - acc.bonus, atacantes deben SAB CD14 o elegir otro objetivo","Ayuda (nv2) - 3 criaturas ganan +5 PG maximos durante 8 horas, sin concentracion","Plegaria de Curacion (nv2) - 10 min, hasta 6 criaturas recuperan 2d8+3 PG (fuera de combate)","Espiritus Guardianes (nv3) - conc, 10 min, criaturas hostiles en 15 pies de ti: SAB CD14, 3d8 radiante (mitad si pasan)","Disipar Magia (nv3) - accion, cancela un conjuro de nivel 3 o inferior automaticamente"]},fe:[{n:"Vision en la Oscuridad",d:"60 pies."},{n:"Resistencia al Fuego",d:"Mitad de dano de fuego."},{n:"Discipulo de la Vida",d:"Cuando lanzas conjuro de curacion nv1+, el objetivo recupera 2 + nivel del conjuro PG adicionales. (Curar Heridas nv1: 1d8+6. Palabra Sanadora nv1: 1d4+6. Curar Heridas nv3: 3d8+8.)"},{n:"Canalizar Divinidad",d:"Elige UNO:\n- Expulsar No-muertos: accion, no-muertos en 30 pies SAB CD14 o huyen 1 min. CR 1/2 o menor: destruidos.\n- Preservar Vida: accion, repartes 25 PG entre criaturas en 30 pies (ninguna supera mitad de PG max).",u:1},{n:"Represalia Infernal",d:"Reaccion cuando te danan. El atacante recibe 3d10 fuego (nivel 2 racial). DES CD14 para mitad.",u:1},{n:"Oscuridad (racial)",d:"Creas oscuridad magica en 15 pies de radio. 1/descanso largo.",u:1}],co:[{n:"Pocion de Curacion Mayor (un solo uso)",d:"4d4+4 PG.",a:"Accion: beber."},{n:"Pergamino de Revivificar (un solo uso)",d:"Resucita criatura muerta hace menos de 1 minuto. Vuelve con 1 PG. No necesita diamante.",a:"Accion: leer el pergamino (se consume)."}],eq:"Cota de mallas, escudo, maza, simbolo sagrado (colgante con espejo roto), incienso, cuerda 50 pies.",qu:"No necesitas un templo para encontrar la luz. Yo la encontre en el fango.",rp:"Crecio en las calles, rechazado por su aspecto. Cuando todo le fue arrebatado, encontro fe no en un dios de catedrales, sino en uno que escucha a los olvidados. Cura porque sabe lo que es sufrir sin que nadie te ayude. Corazon grande, alergia a la autoridad."},
{s:3,n:"Zara",t:"La Hechicera del Caos",r:"Semielfa",c:"Hechicera 3",su:"Magia Salvaje",st:[8,14,13,12,10,16],hp:17,ac:12,spd:30,pr:2,acd:"Sin armadura (10+2)",sv:["CON +3","CAR +5"],sk:["Engano +5","Persuasion +5","Arcanos +3","Perspicacia +2","Percepcion +2","Juego de Manos +4"],q:"Turno 1: Rayo Abrasador (nivel 2, 3 rayos x 2d6 fuego, +5 cada uno). Para disparos sueltos: Rayo de Fuego (truco, 1d10, 120 pies). Si te atacan: REACCION Escudo (+5 CA hasta tu proximo turno). Dano seguro: Proyectil Magico (3d4+3, auto-acierto). CUIDADO: solo tienes 17 PG, mantente lejos del combate cuerpo a cuerpo.",at:[{n:"Rayo de Fuego (truco)",h:"+5",d:"1d10 fuego",t:"120 pies"},{n:"Descarga de Choque",h:"+5",d:"1d8 relampago",t:"Toque. Objetivo sin reacciones."},{n:"Daga",h:"+4",d:"1d4+2",t:"20/60 pies"}],sp:{dc:13,ak:"+5",sl:[4,2],ca:["Rayo de Fuego - +5, 1d10 fuego, 120 pies","Prestidigitacion - efectos menores multiples","Descarga de Choque - +5, 1d8 relampago, toque, objetivo sin reacciones","Luz - un objeto brilla como antorcha 1 hora"],al:[],pr:["Proyectil Magico (nv1) - 3 dardos x 1d4+1 fuerza, auto-acierto. A nv2: 4 dardos","Escudo (nv1) - REACCION cuando te atacan, +5 CA hasta tu proximo turno","Dormir (nv1) - 5d8 PG de criaturas en area se duermen (sin salvacion)","Rayo Abrasador (nv2) - 3 rayos, +5 cada uno, 2d6 fuego cada rayo"]},fe:[{n:"Vision en la Oscuridad",d:"60 pies."},{n:"Ventaja vs Encantamiento",d:"No puedes ser dormida magicamente."},{n:"Oleada de Magia Salvaje",d:"Tras lanzar conjuro nv1+, el DM puede pedirte 1d20. En un 1: efecto aleatorio de la tabla."},{n:"Marea del Caos",d:"Ventaja en 1 ataque, prueba o salvacion. El DM puede activar Oleada en tu siguiente conjuro.",u:1},{n:"Puntos de Hechiceria",d:"Metamagia Potenciada: al hacer dano, retira hasta 3 dados bajos (1 PH). Metamagia Sutil: sin componentes verbales ni somaticos (1 PH).",p:3}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion: beber."},{n:"Pergamino de Escudo (un solo uso)",d:"+5 CA como reaccion hasta tu proximo turno. Para cuando ya hayas gastado tu propio Escudo.",a:"Reaccion: leer el pergamino (se consume)."}],eq:"Daga, foco arcano (cristal en collar), kit de disfraz, dados trucados.",qu:"La magia es como el fuego. No es buena ni mala. Solo quema.",rp:"Descubrio su magia por accidente cuando era joven. Desde entonces viaja intentando controlar un poder que a veces tiene vida propia. Descarada e impredecible."},
{s:3,n:"Kael",t:"El Muro de Piedra",r:"Enano de Colina",c:"Guerrero 3",su:"Campeon",st:[15,12,16,8,14,10],hp:34,ac:19,spd:25,pr:2,acd:"Mallas+escudo+Defensa",sv:["FUE +4","CON +5"],sk:["Atletismo +4","Percepcion +4","Supervivencia +4","Intimidacion +2"],q:"Ataca con espada larga (+4, 1d8+2). Tus golpes criticos ocurren en 19 o 20 (doble dados de dano). Si estas herido: Segundo Aliento (acc.bonus, 1d10+3 PG). Si necesitas un turno devastador: Oleada de Accion te da dos acciones completas.",at:[{n:"Espada larga + escudo",h:"+4",d:"1d8+2 cortante",t:"Cuerpo a cuerpo"},{n:"Hacha arrojadiza x2",h:"+4",d:"1d6+2 cortante",t:"20/60 pies"}],fe:[{n:"Vision en la Oscuridad",d:"60 pies."},{n:"Resistencia Enana",d:"Ventaja en salvaciones contra veneno. Resistencia al dano de veneno."},{n:"Tenacidad Enana",d:"+1 PG por nivel (ya incluido)."},{n:"Defensa",d:"+1 CA con armadura (ya incluido en CA 19)."},{n:"Segundo Aliento",d:"Acc.bonus. Recuperas 1d10+3 PG.",u:1},{n:"Oleada de Accion",d:"En tu turno: una Accion adicional completa (puedes atacar dos veces en total).",u:1},{n:"Critico Mejorado",d:"Tus ataques con arma son golpes criticos en un 19 o 20 natural (doble dados de dano)."}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion: beber."},{n:"Pocion de Crecimiento (un solo uso)",d:"Te Agrandas 1d4 horas: ventaja en pruebas y salvaciones de FUE, +1d4 al dano con armas.",a:"Accion: beber."}],eq:"Cota de mallas, escudo, espada larga, 2 hachas arrojadizas.",qu:"No necesito planes complicados. Necesito un escudo y una buena espada.",rp:"Veterano de las guerras enanas. Disciplinado, pragmatico. Protege al grupo sin aspavientos. Pocos necesitan menos palabras para comunicar mas."},
{s:3,n:"Seren",t:"La Protectora Silenciosa",r:"Humana variante",c:"Picara 3",su:"Ladrona",st:[8,16,14,10,14,12],hp:24,ac:15,spd:30,pr:2,acd:"Cuero tachonado (12+3)",sv:["DES +5","INT +2"],sk:["Sigilo +7*","Perspicacia +6*","Percepcion +4","Acrobacia +5","Persuasion +3","Medicina +4"],q:"Explora y protege desde las sombras. Escondete con Accion Astuta (acc.bonus). Ataca con ventaja: espada corta +5, 1d6+3 + 2d6 Furtivo. Manos Rapidas: usa objetos (pociones, agua bendita, kit de curacion) como acc.bonus. Alerta: +5 a iniciativa, nunca sorprendida. Perspicacia +6 para leer intenciones.",at:[{n:"Espada corta",h:"+5",d:"1d6+3+2d6 furtivo",t:"Sutil"},{n:"Daga x2",h:"+5",d:"1d4+3+2d6 furtivo",t:"20/60 pies"},{n:"Arco corto",h:"+5",d:"1d6+3+2d6 furtivo",t:"80/320 pies"}],fe:[{n:"Alerta (dote)",d:"+5 iniciativa. No puedes ser sorprendida."},{n:"Ataque Furtivo 2d6",d:"1 vez por turno: +2d6 si tienes ventaja O un aliado a 5 pies del objetivo. Solo armas de sutileza o a distancia."},{n:"Accion Astuta",d:"Acc.bonus: Dash (doble movimiento), Desenganche (sin ataques de oportunidad) o Esconderse."},{n:"Manos Rapidas",d:"Acc.bonus: usar objeto, herramientas de ladron, o Juego de Manos. Puedes beber pociones o usar agua bendita como acc.bonus."},{n:"Trepar a Toda Velocidad",d:"Trepar no cuesta movimiento extra. Salto en carrera +3 pies."},{n:"Jerga de Ladrones",d:"Lenguaje secreto entre criminales. Mensajes ocultos en conversacion."}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion (o acc.bonus con Manos Rapidas): beber."},{n:"Agua Bendita x2 (un solo uso cada una)",d:"2d6 de dano radiante a no-muertos y demonios.",a:"Accion: ataque a distancia improvisado (20 pies)."},{n:"Kit de Curacion (10 usos)",d:"Estabiliza a una criatura a 0 PG sin tirada de Medicina.",a:"Accion (o acc.bonus con Manos Rapidas)."}],eq:"Espada corta, 2 dagas, arco corto, 20 flechas, cuero tachonado, herramientas de ladron, kit de curacion, cuerda 50 pies.",qu:"La mejor proteccion es que el enemigo nunca sepa que estabas alli.",rp:"Servia en una orden dedicada a proteger a los vulnerables. Cuando descubrio que no siempre bastaba con rezar, aprendio a moverse entre las sombras para actuar donde la luz no llega. Compasiva pero practica. No tolera la crueldad."},
{s:3,n:"Tormund",t:"La Bestia del Norte",r:"Semiorco",c:"Barbaro 3",su:"Camino del Berserker",st:[17,14,14,8,12,10],hp:32,ac:16,spd:30,pr:2,acd:"Escamas (14+2)",sv:["FUE +5","CON +4"],sk:["Atletismo +5","Percepcion +3","Supervivencia +3","Intimidacion +2","Naturaleza +1"],q:"Entra en IRA como acc.bonus: +2 al dano de arma, mitad de dano contundente/perforante/cortante. Ataca con Gran Hacha (+5, 1d12+5 con ira). Usa Ataque Temerario para tener ventaja, pero el enemigo tambien la tiene contra ti. Frenesi = ataque extra cada turno, pero quedas exhausto despues.",at:[{n:"Gran Hacha",h:"+5",d:"1d12+3 (1d12+5 en ira)",t:"Dos manos, pesada"},{n:"Gran Hacha (critico en ira)",h:"+5",d:"3d12+5",t:"Ataques Salvajes: 1d12 extra"},{n:"Jabalina x4",h:"+5",d:"1d6+3 perforante",t:"30/120 pies"}],fe:[{n:"Vision en la Oscuridad",d:"60 pies."},{n:"Resistencia Implacable",d:"Cuando caes a 0 PG sin morir, caes a 1 PG en su lugar.",u:1},{n:"Ataques Salvajes",d:"En un golpe critico cuerpo a cuerpo, tira un dado de dano extra del arma (1d12 adicional con gran hacha)."},{n:"Ira",d:"Acc.bonus. +2 dano cuerpo a cuerpo, resistencia a contundente/perforante/cortante, ventaja en pruebas y salvaciones de FUE. Dura 1 min. No puedes lanzar conjuros. Acaba si no atacas ni recibes dano.",u:3},{n:"Ataque Temerario",d:"En tu primer ataque del turno, puedes atacar con ventaja. Hasta tu proximo turno, los ataques contra ti tambien tienen ventaja."},{n:"Sentido del Peligro",d:"Ventaja en salvaciones de DES contra efectos que puedas ver (trampas, conjuros)."},{n:"Frenesi",d:"Mientras estes en ira, puedes hacer un ataque cuerpo a cuerpo adicional como acc.bonus cada turno. Al acabar la ira: 1 nivel de exhaustion. Solo en peleas importantes."}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion: beber."},{n:"Pocion de Fuerza de Gigante de Colina (un solo uso)",d:"Tu FUE pasa a 21 (+5) durante 1 hora. Tus ataques pasan a +7, dano 1d12+5 (1d12+7 en ira).",a:"Accion: beber."}],eq:"Gran hacha, 4 jabalinas, cota de escamas.",qu:"Hablar es para los debiles. Pero luchar al lado de alguien... eso es un vinculo.",rp:"Exiliado de su clan por negarse a matar prisioneros. Fachada brutal que esconde un codigo de honor estricto."},
{s:1,n:"Bran",t:"El Guardia Veterano",r:"Humano",c:"Guerrero 2",su:"Sin subclase (nv2)",st:[16,14,16,8,10,12],hp:22,ac:19,spd:30,pr:2,acd:"Mallas+escudo+Defensa",sv:["FUE +5","CON +5"],sk:["Atletismo +5","Intimidacion +3","Percepcion +2","Supervivencia +2"],q:"Ataca con espada larga (+5, 1d8+3). Si estas herido: Segundo Aliento (acc.bonus, 1d10+2 PG). Si necesitas un turno devastador: Oleada de Accion para dos ataques. Llevas antorchas y frascos de aceite que pueden ser utiles para prender fuego a cosas.",at:[{n:"Espada larga",h:"+5",d:"1d8+3 cortante",t:"Cuerpo a cuerpo"},{n:"Hacha arrojadiza x2",h:"+5",d:"1d6+3 cortante",t:"20/60 pies"},{n:"Antorcha (improvisada)",h:"+5",d:"1 fuego",t:"Cuerpo a cuerpo"}],fe:[{n:"Defensa",d:"+1 CA con armadura (ya incluido en CA 19)."},{n:"Segundo Aliento",d:"Acc.bonus. Recuperas 1d10+2 PG.",u:1},{n:"Oleada de Accion",d:"En tu turno: una Accion adicional completa.",u:1}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion: beber."},{n:"Frascos de aceite x2 (un solo uso cada uno)",d:"Vierte en 5 pies cuadrados y enciende: 5 de dano de fuego a quien entre. O unta una antorcha para fuego extra.",a:"Accion: verter o lanzar (20 pies)."}],eq:"Cota de mallas, escudo, espada larga, 2 hachas arrojadizas, 2 antorchas, 2 frascos de aceite.",qu:"No necesito entender la magia. Necesito que los que la entienden esten detras de mi escudo.",rp:"Guardia veterano de un pueblo cercano. Pragmatico, protector, pocas palabras. Llego escoltando una caravana comercial. Siempre se pone entre el peligro y los demas."},
{s:1,n:"Elara",t:"La Sanadora",r:"Humana",c:"Cleriga 2",su:"Dominio de la Vida",st:[14,12,14,8,16,12],hp:17,ac:18,spd:30,pr:2,acd:"Mallas+escudo",sv:["SAB +5","CAR +3"],sk:["Perspicacia +5","Religion +1","Medicina +5","Persuasion +3"],q:"Llama Sagrada para danar (1d8 radiante, DES CD13, ignora cobertura). Palabra Sanadora para curar (acc.bonus, 60 pies, 1d4+6 PG). Si el grupo esta muy herido: Preservar Vida (repartes 10 PG entre aliados en 30 pies). Canalizar Divinidad puede cambiar el curso de un encuentro.",at:[{n:"Maza",h:"+4",d:"1d6+2 contundente",t:"Cuerpo a cuerpo"},{n:"Llama Sagrada (truco)",h:"DES CD13",d:"1d8 radiante",t:"60 pies, ignora cobertura"}],sp:{dc:13,ak:"+5",sl:[3],ca:["Llama Sagrada - DES CD13, 1d8 radiante, 60 pies, ignora cobertura","Reposo Eterno - toque, estabiliza a 0 PG (no gasta espacio)","Guia - toque, concentracion, +1d4 a prueba de habilidad"],al:["Bendicion - conc, 3 criaturas +1d4 ataques y salvaciones","Curar Heridas - toca, 1d8+6 PG (Discipulo incluido)"],pr:["Palabra Sanadora - ACC.BONUS, 60 pies, 1d4+6 PG","Rayo Guia - +5, 4d6 radiante + ventaja al siguiente ataque","Escudo de Fe - acc.bonus, +2 CA, concentracion","Detectar Magia - concentracion, ritual","Santuario - acc.bonus, SAB CD13 o elige otro objetivo"]},fe:[{n:"Discipulo de la Vida",d:"Curacion nv1+: +3 PG extra (2+nivel del conjuro)."},{n:"Canalizar Divinidad",d:"Elige UNO:\n- Expulsar No-muertos: accion, no-muertos en 30 pies SAB CD13 o huyen 1 min.\n- Preservar Vida: accion, repartes 10 PG entre criaturas en 30 pies.",u:1}],co:[{n:"Pocion de Curacion (un solo uso)",d:"2d4+2 PG.",a:"Accion: beber."},{n:"Agua Bendita x2 (un solo uso cada una)",d:"2d6 de dano radiante a no-muertos y demonios.",a:"Accion: ataque a distancia improvisado (20 pies)."}],eq:"Cota de mallas, escudo, maza, simbolo sagrado, pack de sacerdote.",qu:"La luz no distingue entre dignos e indignos. Yo tampoco.",rp:"Sacerdotisa de paso rumbo a un templo lejano. Compasiva pero directa. Cuando ve sufrimiento, no pide permiso para ayudar."},

var SNAMES=[{s:1,l:"Sesion 1 - El Rey Bajo la Colina",d:"Nivel 2"},{s:2,l:"Sesion 2 - La Maldición de Pantanovago",d:"Nivel 3"},{s:3,l:"Sesion 3 - El Precio del Deseo",d:"Nivel 3/5"}];
var REF=[{t:"Tu turno en combate",c:"Puedes hacer tres cosas en cualquier orden:\n\n1. MOVERTE hasta tu velocidad en pies.\n2. UNA ACCION: atacar, conjuro, esquivar, ayudar, esconderte, dash, desenganche, usar objeto.\n3. ACCION BONUS (solo si tu clase lo permite).\n\nTambien tienes UNA REACCION por ronda (fuera de tu turno)."},{t:"Como atacar",c:"1. Di a quien atacas y con que.\n2. Tira 1d20 + bonificador de ataque.\n3. Si resultado es igual o mayor que la CA del enemigo: impactas.\n4. Tira dado de dano + modificador.\n\nNatural 20 = CRITICO (doble dados de dano).\nNatural 1 = FALLO AUTOMATICO."},{t:"Salvaciones",c:"El DM te pide una salvacion (ej: DES CD14).\n\n1. Tira 1d20 + modificador de esa salvacion.\n2. Si resultado es igual o mayor que la CD: la pasas."},{t:"Ventaja y Desventaja",c:"VENTAJA: Tira 2d20, quedate con el MAS ALTO.\nDESVENTAJA: Tira 2d20, quedate con el MAS BAJO.\n\nSi tienes ambas a la vez, se cancelan (tiras normal)."},{t:"Conjuros basicos",c:"TRUCOS: Gratis e ilimitados. Usalos siempre.\n\nCONJUROS CON ESPACIO: Gastan un espacio de conjuro. Recuperas todos en descanso largo.\n\nCD DE CONJURO: El enemigo tira contra tu CD.\n\nATAQUE MAGICO: Tu tiras d20 + bonificador.\n\nCONCENTRACION: Solo 1 a la vez. Si recibes dano: CON CD10 (o mitad dano si es mayor). Si fallas, pierdes el conjuro."},{t:"Caer a 0 PG",c:"Caes INCONSCIENTE. Al inicio de cada turno tira 1d20:\n\n10 o mas = 1 exito\n9 o menos = 1 fallo\nNatural 20 = recuperas 1 PG y despiertas\nNatural 1 = cuenta como 2 fallos\n\n3 exitos: te estabilizas.\n3 fallos: mueres.\n\nSi un aliado te cura mientras estas a 0: despiertas inmediatamente."},{t:"Descansos",c:"CORTO (1 hora): Puedes gastar dados de golpe para curarte. Algunas habilidades se recargan.\n\nLARGO (8 horas): Recuperas TODOS los PG y TODOS los espacios de conjuro."},{t:"Estados comunes",c:"ASUSTADO: Desventaja en ataques y habilidades mientras veas la fuente. No puedes acercarte.\n\nDERRIBADO: Solo puedes gatear. Tus ataques con desventaja. CaC contra ti con ventaja.\n\nAGARRADO: Velocidad 0. Escapar con Atletismo o Acrobacia.\n\nRESTRINGIDO: Velocidad 0, ataques contra ti ventaja, tus ataques desventaja.\n\nENVENENADO: Desventaja en ataques y pruebas de habilidad.\n\nCEGADO: Tus ataques desventaja, contra ti ventaja."}];

var sel=null,tab=0,hpV={},slotV={},useV={},poolV={};
var app=document.getElementById("app");

function showPick(){
sel=null;
var h='<div class="pick"><h1>Elige tu personaje</h1><p class="sub">Casa Rural D&D - Toca el tuyo</p>';
for(var g=0;g<SNAMES.length;g++){var sn=SNAMES[g];
h+='<div class="grp">'+sn.l+' - '+sn.d+'</div>';
for(var i=0;i<C.length;i++){if(C[i].s!==sn.s)continue;var c=C[i];
h+='<button class="pc" style="animation-delay:'+Math.min(i*40,300)+'ms" onclick="pickChar('+i+')"><div class="lf"><div class="nm">'+c.n+(c.ex?'<span class="exp-b">NIVEL 5</span>':'')+'</div><div class="ti">'+c.t+'</div><div class="rc">'+c.r+' - '+c.c+'</div></div><div class="ri">CA '+c.ac+'<br>PG '+c.hp+'</div></button>';
}}
h+='</div>';
app.innerHTML=h;
}

function pickChar(i){sel=i;tab=0;if(hpV[i]===undefined)hpV[i]=C[i].hp;showSheet();}

function showSheet(){
var c=C[sel];var mods=[];for(var i=0;i<6;i++)mods.push(Math.floor((c.st[i]-10)/2));
var hp=hpV[sel];var hcl=hp<=c.hp*0.25?'var(--red)':hp<=c.hp*0.5?'var(--amb)':'var(--ink)';
var h='<button class="back" onclick="showPick()">← Cambiar personaje</button>';
h+='<div class="sh"><div class="nm2">'+c.n+'</div><div class="ti2">'+c.t+'</div><div class="me2">'+c.r+' - '+c.c+' - '+c.su+'</div></div>';
h+='<div class="tabs"><button class="'+(tab===0?'on':'')+'" onclick="tab=0;showSheet()">Personaje</button><button class="'+(tab===1?'on':'')+'" onclick="tab=1;showSheet()">Referencia D&D</button></div>';
h+='<div class="cnt">';
if(tab===0){
h+='<div class="qs"><b>INICIO RAPIDO</b>'+c.q+'</div>';
h+='<div class="hprow"><span class="lb">PG</span><button class="b1" onclick="adjHP(-1)">-</button><span class="vl" style="color:'+hcl+'">'+hp+'</span><button class="b1" onclick="adjHP(1)">+</button><span class="mx">/ '+c.hp+'</span><button class="bt" onclick="hpV[sel]=C[sel].hp;showSheet()">MAX</button></div>';
h+='<div class="sg">';for(var i=0;i<6;i++)h+='<div class="si"><div class="sl">'+SN[i]+'</div><div class="sv">'+c.st[i]+'</div><div class="sm">'+(mods[i]>=0?'+':'')+mods[i]+'</div></div>';h+='</div>';
h+='<div class="i3"><div><div class="il">CA</div><div class="iv">'+c.ac+'</div><div class="id">'+c.acd+'</div></div><div><div class="il">Velocidad</div><div class="iv">'+c.spd+'p</div></div><div><div class="il">Competencia</div><div class="iv">+'+c.pr+'</div></div></div>';
h+='<div class="skl"><b style="color:var(--ink3)">Salvaciones:</b> '+c.sv.join(', ')+'</div>';
h+='<div class="skl"><b style="color:var(--ink3)">Habilidades:</b> '+c.sk.join(', ')+'</div>';
var hasE=false;for(var j=0;j<c.sk.length;j++)if(c.sk[j].indexOf('*')!==-1)hasE=true;
if(hasE)h+='<div class="sn">* = Experto (doble competencia)</div>';
h+='<details class="sec" open><summary>Ataques</summary><div class="bd">';
for(var i=0;i<c.at.length;i++){var a=c.at[i];h+='<div class="atkr"><div class="rw"><b>'+a.n+'</b><span style="color:var(--ink2)">'+a.h+' | '+a.d+'</span></div>'+(a.t?'<div class="nt">'+a.t+'</div>':'')+'</div>';}
h+='</div></details>';
if(c.sp){h+='<details class="sec" open><summary>Conjuros</summary><div class="bd">';
h+='<div style="font-size:.8rem;margin-bottom:8px"><b style="color:var(--ink3)">CD:</b> '+c.sp.dc+' <b style="color:var(--ink3);margin-left:12px">Ataque:</b> '+c.sp.ak+'</div>';
h+=renderSlots(sel,c.sp.sl);
if(c.sp.ca&&c.sp.ca.length>0){h+='<div class="spcat">TRUCOS (ilimitados)</div>';for(var i=0;i<c.sp.ca.length;i++)h+='<div class="spl">'+c.sp.ca[i]+'</div>';}
if(c.sp.al&&c.sp.al.length>0){h+='<div class="spcat">SIEMPRE PREPARADOS</div>';for(var i=0;i<c.sp.al.length;i++)h+='<div class="spl">'+c.sp.al[i]+'</div>';}
if(c.sp.pr&&c.sp.pr.length>0){h+='<div class="spcat">'+((c.sp.al&&c.sp.al.length>0)?'PREPARADOS':'CONOCIDOS')+'</div>';for(var i=0;i<c.sp.pr.length;i++)h+='<div class="spl">'+c.sp.pr[i]+'</div>';}
h+='</div></details>';}
h+='<details class="sec"><summary>Rasgos y habilidades</summary><div class="bd">';
for(var i=0;i<c.fe.length;i++){var f=c.fe[i];h+='<div class="ft"><div style="display:flex;align-items:center;flex-wrap:wrap"><span class="fn">'+f.n+'</span>';
if(f.u!==undefined){var k=sel+'u'+i;if(useV[k]===undefined)useV[k]=f.u;h+=renderUses(k,f.u);}
if(f.p!==undefined){var k=sel+'p'+i;if(poolV[k]===undefined)poolV[k]=f.p;h+=renderPool(k,f.p);}
h+='</div><div class="fd">'+f.d+'</div></div>';}
h+='</div></details>';
h+='<details class="sec" open><summary>Consumibles</summary><div class="bd">';
for(var i=0;i<c.co.length;i++){var x=c.co[i];h+='<div class="cn"><div class="cnn">'+x.n+'</div><div class="cnd">'+x.d+'</div><div class="cna">'+x.a+'</div></div>';}
h+='</div></details>';
h+='<details class="sec"><summary>Roleplay y equipo</summary><div class="bd"><div class="rpq">"'+c.qu+'"</div><div class="rpd">'+c.rp+'</div><div class="rpe">'+c.eq+'</div></div></details>';
}else{
h+='<div class="ref">';
for(var i=0;i<REF.length;i++){var r=REF[i];h+='<details class="sec"'+(i===0?' open':'')+'><summary>'+r.t+'</summary><div class="bd" style="white-space:pre-line">'+r.c+'</div></details>';}
h+='</div>';
}
h+='</div>';
app.innerHTML=h;window.scrollTo(0,0);
}

function adjHP(d){hpV[sel]=Math.max(0,Math.min(C[sel].hp,hpV[sel]+d));showSheet();}

function renderSlots(ci,sl){
if(!slotV[ci]){slotV[ci]=[];for(var l=0;l<sl.length;l++){slotV[ci][l]=[];for(var j=0;j<sl[l];j++)slotV[ci][l].push(false);}}
var h='<div class="slt">';
for(var l=0;l<sl.length;l++){h+='<div class="slg"><span class="ll">Nv.'+(l+1)+':</span>';
for(var j=0;j<sl[l];j++){var on=slotV[ci][l][j];h+='<button class="dot'+(on?' on':'')+'" onclick="togSlot('+ci+','+l+','+j+')">'+(on?'X':'')+'</button>';}
h+='</div>';}
h+='<button class="bt" onclick="rstSlots('+ci+')">REST</button></div>';return h;
}
function togSlot(ci,l,j){slotV[ci][l][j]=!slotV[ci][l][j];showSheet();}
function rstSlots(ci){var sl=C[ci].sp.sl;slotV[ci]=[];for(var l=0;l<sl.length;l++){slotV[ci][l]=[];for(var j=0;j<sl[l];j++)slotV[ci][l].push(false);}showSheet();}

function renderUses(k,max){var v=useV[k];return '<span class="uses"><button class="bsm" onclick="adjUse(\''+k+'\',-1,'+max+')">-</button><span class="uv" style="color:'+(v===0?'var(--red)':'var(--ink)')+'">'+v+'/'+max+'</span><button class="bsm" onclick="adjUse(\''+k+'\',1,'+max+')">+</button></span>';}
function adjUse(k,d,max){useV[k]=Math.max(0,Math.min(max,useV[k]+d));showSheet();}

function renderPool(k,max){var v=poolV[k];return '<span class="uses" style="margin-left:6px"><span style="font-size:.7rem;color:var(--ink3)">Reserva:</span><button class="bsm" onclick="adjPool(\''+k+'\',-1,'+max+')">-</button><span class="uv" style="color:'+(v===0?'var(--red)':'var(--ink)')+'">'+v+'</span><button class="bsm" onclick="adjPool(\''+k+'\',1,'+max+')">+</button></span>';}
function adjPool(k,d,max){poolV[k]=Math.max(0,Math.min(max,poolV[k]+d));showSheet();}

try{showPick();}catch(e){app.innerHTML='<div style="padding:20px;color:var(--red)">Error: '+e.message+'</div>';}
</script>
</body></html>
