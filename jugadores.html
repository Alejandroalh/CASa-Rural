var SNAMES=[{s:1,l:"Sesión 1 — Pantanovago",d:"Nivel 3"},{s:2,l:"Sesión 2 — El Precio del Deseo",d:"Nivel 3/5"},{s:3,l:"El Rey Bajo la Colina",d:"Nivel 2"}];
var REF=[{t:"Tu turno",c:"1. MOVERTE (hasta velocidad)\n2. UNA ACCIÓN (atacar, conjuro, esquivar, ayudar, esconderte, dash, desenganche, objeto)\n3. ACCIÓN BONUS (si clase lo permite)\n\n+ UNA REACCIÓN por ronda (fuera de turno)"},{t:"Atacar",c:"d20 + bonificador ataque\n≥ CA enemigo = impactas\nTira daño + modificador\n\nNat 20 = CRÍTICO (doble dados)\nNat 1 = FALLO"},{t:"Salvaciones",c:"DM pide (ej: DES CD14)\nd20 + modificador\n≥ CD = pasas"},{t:"Ventaja / Desventaja",c:"VENTAJA: 2d20, el más alto\nDESVENTAJA: 2d20, el más bajo\nAmbas = normal"},{t:"Conjuros",c:"TRUCOS: gratis, ilimitados\nCONJUROS: gastan espacio. Recuperas desc.largo\nCONCENTRACIÓN: solo 1. Si daño: CON CD10 o pierdes"},{t:"Caer a 0 PG",c:"Inconsciente. Cada turno d20:\n10+ = éxito · 9- = fallo\nNat20 = 1PG · Nat1 = 2 fallos\n3 éxitos = estable · 3 fallos = mueres\nCuración = despiertas"},{t:"Descansos",c:"CORTO (1h): dados de golpe\nLARGO (8h): todo PG + espacios"},{t:"Estados",c:"ASUSTADO: desventaja, no acercarte\nDERRIBADO: gatear, desventaja, CaC ventaja\nAGARRADO: vel.0, escapar Atletismo/Acrobacia\nENVENENADO: desventaja ataques+pruebas"}];

var sel=null,tab=0,hpV={},slotV={},useV={},poolV={};
var app=document.getElementById("app");

function showPick(){
sel=null;
var h='<h1>Elige tu personaje</h1><p class="sub">Casa Rural D&D · Toca el tuyo</p>';
for(var g=0;g<SNAMES.length;g++){
var sn=SNAMES[g];
h+='<div class="grp">'+sn.l+' · '+sn.d+'</div>';
for(var i=0;i<C.length;i++){
if(C[i].s!==sn.s)continue;
var c=C[i];
h+='<button class="pc" onclick="pickChar('+i+')"><div><div class="nm">'+c.n+(c.ex?'<span class="exp-badge">NIVEL 5</span>':'')+'</div><div class="meta">'+c.t+'</div><div class="rc">'+c.r+' · '+c.c+'</div></div><div class="ri">CA '+c.ac+'<br>PG '+c.hp+'</div></button>';
}
}
app.innerHTML=h;
}

function pickChar(i){
sel=i;tab=0;
if(hpV[i]===undefined)hpV[i]=C[i].hp;
showSheet();
}

function showSheet(){
var c=C[sel];
var mods=[];for(var i=0;i<6;i++)mods.push(Math.floor((c.st[i]-10)/2));
var hp=hpV[sel];
var hcl=hp<=c.hp*0.25?'#e55':hp<=c.hp*0.5?'#da5':'#e0ddd4';

var h='<button class="back" onclick="showPick()">← Cambiar personaje</button>';
h+='<div class="nm2">'+c.n+'</div><div class="ti2">'+c.t+'</div><div class="me2">'+c.r+' · '+c.c+' · '+c.su+'</div>';
h+='<div class="tabbar"><button class="'+(tab===0?'on':'')+'" onclick="tab=0;showSheet()">Personaje</button><button class="'+(tab===1?'on':'')+'" onclick="tab=1;showSheet()">Referencia</button></div>';

if(tab===0){
h+='<div class="qs"><b>INICIO RÁPIDO</b>'+c.q+'</div>';
h+='<div class="hprow"><span class="lb">PG</span><button class="b1" onclick="adjHP(-1)">−</button><span class="vl" style="color:'+hcl+'">'+hp+'</span><button class="b1" onclick="adjHP(1)">+</button><span class="mx">/ '+c.hp+'</span><button class="bt" onclick="hpV[sel]=C[sel].hp;showSheet()">MAX</button></div>';
h+='<div class="sg">';for(var i=0;i<6;i++)h+='<div class="si"><div class="sl">'+SN[i]+'</div><div class="sv">'+c.st[i]+'</div><div class="sm">'+(mods[i]>=0?'+':'')+mods[i]+'</div></div>';h+='</div>';
h+='<div class="i3"><div><div class="il">CA</div><div class="iv">'+c.ac+'</div><div class="id">'+c.acd+'</div></div><div><div class="il">Velocidad</div><div class="iv">'+c.spd+'p</div></div><div><div class="il">Competencia</div><div class="iv">+'+c.pr+'</div></div></div>';
h+='<div class="skl"><b style="color:#888">Salvaciones:</b> '+c.sv.join(', ')+'</div>';
h+='<div class="skl"><b style="color:#888">Habilidades:</b> '+c.sk.join(', ')+'</div>';
var hasE=false;for(var j=0;j<c.sk.length;j++)if(c.sk[j].indexOf('★')!==-1)hasE=true;
if(hasE)h+='<div class="sn">★ = Experto (doble competencia)</div>';

h+='<details class="acc" open><summary>⚔️ Ataques</summary><div class="bd">';
for(var i=0;i<c.at.length;i++){var a=c.at[i];h+='<div class="atkr"><div class="rw"><b>'+a.n+'</b><span style="color:#999">'+a.h+' | '+a.d+'</span></div>'+(a.t?'<div class="nt">'+a.t+'</div>':'')+'</div>';}
h+='</div></details>';

if(c.sp){
h+='<details class="acc" open><summary>✨ Conjuros</summary><div class="bd">';
h+='<div style="font-size:12px;margin-bottom:6px"><b style="color:#888">CD:</b> '+c.sp.dc+' <b style="color:#888;margin-left:10px">Ataque:</b> '+c.sp.ak+'</div>';
h+=renderSlots(sel,c.sp.sl);
if(c.sp.ca&&c.sp.ca.length>0){h+='<div class="spcat">TRUCOS (ilimitados)</div>';for(var i=0;i<c.sp.ca.length;i++)h+='<div class="spl">'+c.sp.ca[i]+'</div>';}
if(c.sp.al&&c.sp.al.length>0){h+='<div class="spcat">SIEMPRE PREPARADOS</div>';for(var i=0;i<c.sp.al.length;i++)h+='<div class="spl">'+c.sp.al[i]+'</div>';}
if(c.sp.pr&&c.sp.pr.length>0){h+='<div class="spcat">'+((c.sp.al&&c.sp.al.length>0)?'PREPARADOS':'CONOCIDOS')+'</div>';for(var i=0;i<c.sp.pr.length;i++)h+='<div class="spl">'+c.sp.pr[i]+'</div>';}
h+='</div></details>';
}

h+='<details class="acc"><summary>🔮 Rasgos y habilidades</summary><div class="bd">';
for(var i=0;i<c.fe.length;i++){var f=c.fe[i];h+='<div class="ft"><div style="display:flex;align-items:center;flex-wrap:wrap"><span class="fn">'+f.n+'</span>';
if(f.u!==undefined){var k=sel+'u'+i;if(useV[k]===undefined)useV[k]=f.u;h+=renderUses(k,f.u);}
if(f.p!==undefined){var k=sel+'p'+i;if(poolV[k]===undefined)poolV[k]=f.p;h+=renderPool(k,f.p);}
h+='</div><div class="fd">'+f.d+'</div></div>';}
h+='</div></details>';

h+='<details class="acc" open><summary>🧪 Consumibles</summary><div class="bd">';
for(var i=0;i<c.co.length;i++){var x=c.co[i];h+='<div class="cn"><div class="cnn">'+x.n+'</div><div class="cnd">'+x.d+'</div><div class="cna">'+x.a+'</div></div>';}
h+='</div></details>';

h+='<details class="acc"><summary>🎭 Roleplay y equipo</summary><div class="bd"><div class="rpq">"'+c.qu+'"</div><div class="rpd">'+c.rp+'</div><div class="rpe">'+c.eq+'</div></div></details>';

}else{
for(var i=0;i<REF.length;i++){var r=REF[i];h+='<details class="acc"'+(i===0?' open':'')+'><summary>'+r.t+'</summary><div class="bd" style="white-space:pre-line">'+r.c+'</div></details>';}
}
app.innerHTML=h;
window.scrollTo(0,0);
}

function adjHP(d){hpV[sel]=Math.max(0,Math.min(C[sel].hp,hpV[sel]+d));showSheet();}

function renderSlots(ci,sl){
if(!slotV[ci]){slotV[ci]=[];for(var l=0;l<sl.length;l++){slotV[ci][l]=[];for(var j=0;j<sl[l];j++)slotV[ci][l].push(false);}}
var h='<div class="slt">';
for(var l=0;l<sl.length;l++){
h+='<div class="slg"><span class="ll">Nv.'+(l+1)+':</span>';
for(var j=0;j<sl[l];j++){var on=slotV[ci][l][j];h+='<button class="dot'+(on?' on':'')+'" onclick="togSlot('+ci+','+l+','+j+')">'+(on?'✕':'')+'</button>';}
h+='</div>';}
h+='<button class="bt" onclick="rstSlots('+ci+')">REST</button></div>';return h;
}
function togSlot(ci,l,j){slotV[ci][l][j]=!slotV[ci][l][j];showSheet();}
function rstSlots(ci){var sl=C[ci].sp.sl;slotV[ci]=[];for(var l=0;l<sl.length;l++){slotV[ci][l]=[];for(var j=0;j<sl[l];j++)slotV[ci][l].push(false);}showSheet();}

function renderUses(k,max){var v=useV[k];return '<span class="uses"><button class="bsm" onclick="adjUse(\''+k+'\',-1,'+max+')">−</button><span class="uv" style="color:'+(v===0?'#e55':'#e0ddd4')+'">'+v+'/'+max+'</span><button class="bsm" onclick="adjUse(\''+k+'\',1,'+max+')">+</button></span>';}
function adjUse(k,d,max){useV[k]=Math.max(0,Math.min(max,useV[k]+d));showSheet();}

function renderPool(k,max){var v=poolV[k];return '<span class="uses" style="margin-left:6px"><span style="font-size:10px;color:#666">Reserva:</span><button class="bsm" onclick="adjPool(\''+k+'\',-1,'+max+')">−</button><span class="uv" style="color:'+(v===0?'#e55':'#e0ddd4')+'">'+v+'</span><button class="bsm" onclick="adjPool(\''+k+'\',1,'+max+')">+</button></span>';}
function adjPool(k,d,max){poolV[k]=Math.max(0,Math.min(max,poolV[k]+d));showSheet();}

try{showPick();}catch(e){app.innerHTML='<div style="padding:20px;color:#e55">Error: '+e.message+'<br><br>Intenta recargar la página.</div>';}
</script>
</body></html>
