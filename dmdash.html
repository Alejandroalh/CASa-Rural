<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DM Dashboard</title>
<style>
:root{--bg:#0f1117;--s1:#1a1d27;--s2:#222635;--ink:#e8e9ed;--ink2:#9ca0af;--ink3:#6b7084;--brd:#2d3143;--acc:#60a5fa;--acc2:#818cf8;--red:#f87171;--grn:#4ade80;--amb:#fbbf24;--sa:#c084fc;--sb:#34d399;--sc:#f472b6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
::selection{background:var(--acc);color:var(--bg)}

.app{max-width:720px;margin:0 auto;padding-bottom:80px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 0;border-bottom:1px solid var(--brd)}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand h1{font-size:1.1rem;font-weight:700;color:var(--acc);letter-spacing:-.3px}
.brand .sub{font-size:.72rem;color:var(--ink3)}
.sess{display:flex;gap:5px;margin-bottom:10px}
.sess button{flex:1;padding:10px 4px 8px;border:1px solid var(--brd);border-radius:8px;background:transparent;color:var(--ink2);font-size:.78rem;font-weight:500;cursor:pointer;text-align:center;line-height:1.3;transition:all .15s;-webkit-tap-highlight-color:transparent}
.sess button:active{transform:scale(.97)}
.sess button.on{background:var(--s1);border-color:var(--acc);color:var(--ink)}
.sess button .sn{font-weight:600;display:block;font-size:.82rem}
.sess button .sd{font-size:.65rem;color:var(--ink3);margin-top:1px}
.sess button.on .sd{color:var(--ink2)}
.cats{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{padding:6px 12px;border-radius:20px;border:1px solid var(--brd);background:transparent;color:var(--ink2);font-size:.73rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;-webkit-tap-highlight-color:transparent}
.cats button:active{transform:scale(.95)}
.cats button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}

.main{padding:12px 16px}
.main-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.main-hdr h2{font-size:1.05rem;font-weight:600;color:var(--ink)}
.main-hdr .ct{font-size:.78rem;color:var(--ink3)}
.main-hdr .ct b{color:var(--acc)}

.card{background:var(--s1);border:1px solid var(--brd);border-radius:10px;margin-bottom:8px;overflow:hidden;transition:border-color .15s;animation:fadeUp .25s ease both}
.card:active{border-color:#4a5068}
.card-h{padding:14px 16px;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;-webkit-tap-highlight-color:transparent}
.card-h .lf{flex:1;min-width:0}
.card-h .tl{font-size:.88rem;font-weight:600;color:var(--ink);line-height:1.4}
.card-h .meta{font-size:.7rem;color:var(--ink3);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-h .arr{font-size:.65rem;color:var(--ink3);transition:transform .2s;flex-shrink:0;margin-top:4px}
.card.open .card-h .arr{transform:rotate(180deg)}
.card-bd{display:none;padding:0 16px 14px;font-size:.82rem;color:var(--ink2);line-height:1.65}
.card.open .card-bd{display:block}

.tag{display:inline-block;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.3px;text-transform:uppercase}
.tag-a{color:var(--sa);background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.2)}
.tag-b{color:var(--sb);background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2)}
.tag-c{color:var(--sc);background:rgba(244,114,182,.1);border:1px solid rgba(244,114,182,.2)}

.qt{background:var(--s2);border-left:3px solid var(--acc);border-radius:0 6px 6px 0;padding:10px 12px;margin:8px 0;font-style:italic;font-size:.82rem;color:#c8cad4}
.lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin:10px 0 4px;padding-top:6px;border-top:1px solid var(--brd)}
.hk{font-size:.78rem;padding:2px 0;color:var(--ink2)}
.hk::before{content:"› ";color:var(--ink3)}
.nd{font-size:.78rem;color:var(--acc);margin-top:6px}
.fl{font-size:.78rem;color:var(--grn);margin-top:4px}
.wr{font-size:.78rem;color:var(--amb);font-style:italic;margin-top:4px}
.mu{font-size:.72rem;color:var(--ink3);margin-top:6px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1f2233;font-size:.82rem}
.row:last-child{border:none}
.row .rl{color:var(--ink2)}.row .rr{font-weight:600;text-align:right;max-width:55%}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.stat-pill{background:var(--s2);border-radius:6px;padding:3px 10px;font-size:.7rem;color:var(--ink3);font-weight:600}
.stat-pill b{color:var(--acc);display:block;font-size:.85rem;margin-top:1px}
.empty{text-align:center;padding:40px 20px;color:var(--ink3);font-size:.88rem}
.empty .ei{font-size:2rem;margin-bottom:8px}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head><body>

function $(id){return document.getElementById(id)}
function Q(s){return document.querySelector(s)}

function nav(){
var h="";for(var i=0;i<SE.length;i++){var s=SE[i];
h+='<button class="'+(s.id===sid?"on":"")+'" onclick="go(\''+s.id+'\')"><span class="sn">'+s.sh+'</span><span class="sd">'+s.sub+'</span></button>';}
$("ss").innerHTML=h;
var c="";for(var i=0;i<CATS.length;i++){var ct=CATS[i];
c+='<button class="'+(ct.id===cat?"on":"")+'" onclick="sw(\''+ct.id+'\')">'+ct.l+'</button>';}
$("cs").innerHTML=c;
}

function go(id){sid=id;cat="tr";nav();ren();}
function sw(id){cat=id;nav();ren();}

function tog(el){var card=el.closest('.card');card.classList.toggle('open');}

function ren(){
var s=null;for(var i=0;i<SE.length;i++){if(SE[i].id===sid){s=SE[i];break;}}
if(!s)return;
var tc="tag-"+s.cl;
var items=[];var h="";var title="";var count="";

if(cat==="tr"){
title="Trama";items=s.story||[];count="<b>"+items.length+"</b> secciones";
for(var i=0;i<items.length;i++){var st=items[i];
h+='<div class="card'+(i===0?" open":"")+'" style="animation-delay:'+Math.min(i*30,200)+'ms"><div class="card-h" onclick="tog(this)"><div class="lf"><div class="tl">'+st.t+'</div></div><span class="arr">▼</span></div><div class="card-bd">'+st.c+'</div></div>';
}}

else if(cat==="sc"){
title="Escenas";items=s.scenes||[];count="<b>"+items.length+"</b> escenas";
for(var i=0;i<items.length;i++){var sc=items[i];
h+='<div class="card'+(i===0?" open":"")+'" style="animation-delay:'+Math.min(i*30,200)+'ms"><div class="card-h" onclick="tog(this)"><div class="lf"><div class="tl">'+sc.t+'</div><div class="meta"><span class="tag '+tc+'">'+sc.p+'</span><span>'+sc.time+'</span></div></div><span class="arr">▼</span></div><div class="card-bd">';
h+='<div class="qt">'+sc.o+'</div>';
h+='<div style="margin-bottom:6px">'+sc.s+'</div>';
if(sc.d&&sc.d.length>0){h+='<div class="lbl">CDs y tiradas</div>';for(var j=0;j<sc.d.length;j++)h+='<div class="hk">'+sc.d[j]+'</div>';}
if(sc.h&&sc.h.length>0){h+='<div class="lbl">🪝 Ganchos</div>';for(var j=0;j<sc.h.length;j++)h+='<div class="hk">'+sc.h[j]+'</div>';}
if(sc.nu)h+='<div class="nd">💡 Si atascan: '+sc.nu+'</div>';
if(sc.fa)h+='<div class="fl">🔄 Fail Forward: '+sc.fa+'</div>';
h+='<div class="mu">🎵 '+sc.m+'</div>';
h+='</div></div>';
}}

else if(cat==="en"){
title="Combate";items=s.enemies||[];count="<b>"+items.length+"</b> criaturas";
for(var i=0;i<items.length;i++){var e=items[i];
h+='<div class="card'+(i===0?" open":"")+'" style="animation-delay:'+Math.min(i*30,200)+'ms"><div class="card-h" onclick="tog(this)"><div class="lf"><div class="tl">'+e.n+'</div><div class="meta"><span class="tag '+tc+'">CA '+e.ac+'</span><span class="tag '+tc+'">PG '+e.hp+'</span></div></div><span class="arr">▼</span></div><div class="card-bd">';
h+='<b>Ataque:</b> '+e.at+'<br><b>Especial:</b> '+e.sp;
h+='<div class="wr">Tacticas: '+e.tc+'</div>';
h+='</div></div>';
}}

else if(cat==="np"){
title="NPCs";items=s.npcs||[];count="<b>"+items.length+"</b> personajes";
for(var i=0;i<items.length;i++){var n=items[i];
h+='<div class="card" style="animation-delay:'+Math.min(i*30,200)+'ms"><div class="card-h" onclick="tog(this)"><div class="lf"><div class="tl">'+n.n+'</div><div class="meta"><span>'+n.d+'</span></div></div><span class="arr">▼</span></div><div class="card-bd">';
h+='<div class="qt">'+n.l+'</div>';
h+='<div class="nd" style="color:var(--acc)">🔒 '+n.sc+'</div>';
h+='</div></div>';
}}

else if(cat==="pc"){
title="Grupo";items=s.pcs||[];count="<b>"+items.length+"</b> PJs";
for(var i=0;i<items.length;i++){var p=items[i];
h+='<div class="card'+(i===0?" open":"")+'" style="animation-delay:'+Math.min(i*30,200)+'ms"><div class="card-h" onclick="tog(this)"><div class="lf"><div class="tl">'+p.n+' <span style="font-weight:400;color:var(--ink2)">'+p.c+'</span></div><div class="meta"><span class="tag '+tc+'">PG '+p.hp+'</span><span class="tag '+tc+'">CA '+p.ac+'</span></div></div><span class="arr">▼</span></div><div class="card-bd">';
h+=p.k;
h+='<div class="wr">⚠ '+p.w+'</div>';
h+='</div></div>';
}}

else if(cat==="it"){
title="Objetos";items=s.items||[];count="<b>"+items.length+"</b> items";
for(var i=0;i<items.length;i++){var it=items[i];
h+='<div class="card" style="animation-delay:'+Math.min(i*30,200)+'ms"><div class="card-h" onclick="tog(this)"><div class="lf"><div class="tl">'+it.n+'</div></div><span class="arr">▼</span></div><div class="card-bd">'+it.e+'<br><span style="color:var(--acc)">'+it.a+'</span></div></div>';
}}

else if(cat==="mu"){
title="Musica";items=s.music||[];count="<b>"+items.length+"</b> pistas";
for(var i=0;i<items.length;i++){var m=items[i];
h+='<div class="row"><span class="rl">'+m.s+'</span><span class="rr">'+m.t+'</span></div>';
}}

$("mTitle").textContent=title;
$("mCount").innerHTML=count;
$("out").innerHTML=h||'<div class="empty"><div class="ei">📭</div>Sin contenido</div>';
}

nav();ren();
</script>
