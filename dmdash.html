<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DM Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#e0ddd4;-webkit-text-size-adjust:100%;padding-bottom:60px}
.hdr{position:sticky;top:0;z-index:10;background:#111;border-bottom:1px solid #333;padding:8px 10px 6px}
.sess{display:flex;gap:4px;margin-bottom:6px}
.sess button{flex:1;padding:8px 2px;border-radius:8px;border:1px solid #444;background:none;color:#aaa;font-size:11px;cursor:pointer;text-align:center;line-height:1.3}
.sess button.on{border:2px solid #e0ddd4;background:#1a1a1a;color:#e0ddd4;font-weight:600}
.cats{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cats button{padding:6px 10px;border-radius:16px;border:none;cursor:pointer;white-space:nowrap;font-size:12px;background:#222;color:#999}
.cats button.on{background:#e0ddd4;color:#111}
.content{padding:8px 10px}
.card{border-bottom:1px solid #2a2a2a;padding:0}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:11px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card-h span{font-size:14px;font-weight:500}
.card-h .arr{font-size:10px;color:#666;transition:transform .15s}
.card-h .arr.open{transform:rotate(180deg)}
.card-b{padding:0 0 12px;font-size:13px;line-height:1.55;color:#b0ada4;display:none}
.card-b.open{display:block}
.quote{background:#1a1a1a;border-radius:6px;padding:8px 10px;margin-bottom:8px;font-style:italic;font-size:13px;color:#c8c4ba;border-left:3px solid #555}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;background:#222;color:#999;margin-right:4px;margin-bottom:3px}
.tag.r{background:#3a1515;color:#e88}
.tag.g{background:#153a15;color:#8e8}
.tag.b{background:#15153a;color:#88e}
.tag.y{background:#3a3a15;color:#ee8}
.sub{font-size:12px;color:#777;margin-top:4px}
.hook{font-size:12px;padding:2px 0;color:#b0ada4}
.hook::before{content:"• "}
.warn{font-size:12px;color:#d4a44a;font-style:italic;margin-top:4px}
.fail{font-size:12px;color:#7aaa7a;margin-top:4px}
.nudge{font-size:12px;color:#7a9ed4;margin-top:4px}
.mus{font-size:11px;color:#666;margin-top:4px}
.sec-t{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:1px;margin:8px 0 4px;padding-top:6px;border-top:1px solid #222}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:13px}
.row .l{color:#999}.row .r{font-weight:500;color:#e0ddd4;text-align:right;max-width:60%}
b{color:#e0ddd4}
</style>

<div class="hdr">
<div class="sess" id="sess"></div>
<div class="cats" id="cats"></div>
</div>

items:[{n:"Poción Curación Mayor (Vex)",e:"4d4+4 PG.",a:"Acción."},{n:"Aceite Resbaladizo (Vex)",e:"Cuerpo: Libertad Movimiento 8h. Suelo: Grasa 10min.",a:"Acción."},{n:"Pergamino Escudo (Zara)",e:"Reacción +5CA.",a:"Reacción (consume)."},{n:"Poción Crecimiento (Kael)",e:"Agrandado 1d4h: ventaja FUE, +1d4 daño.",a:"Acción."},{n:"Agua Bendita ×2 (Seren)",e:"2d6 radiante vs no-muertos.",a:"Acción: lanzar 20p."},{n:"Poción Fuerza Gigante (Tormund)",e:"FUE21 1h. Ataques +7, 1d12+7 ira.",a:"Acción."}]},
];

const CATS=[
{id:"sc",l:"📜 Escenas"},{id:"en",l:"⚔️ Combate"},{id:"np",l:"👤 NPCs"},{id:"pc",l:"🛡️ Grupo"},{id:"it",l:"🧪 Objetos"},{id:"mu",l:"🎵 Música"}
];

let sid="a",cat="sc";

function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}

function render(){
const s=SE.find(x=>x.id===sid);
let h="";

if(cat==="sc") s.scenes.forEach((sc,i)=>{
h+=`<div class="card"><div class="card-h" onclick="tog(this)"><span>${sc.t}</span><span class="arr">▼</span></div><div class="card-b">`;
h+=`<div class="quote">"${sc.o}"</div>`;
h+=`<div style="margin-bottom:6px">${sc.s}</div>`;
if(sc.d.length) sc.d.forEach(d=>h+=`<div class="hook">${d}</div>`);
if(sc.h.length){h+=`<div class="sec-t">🪝 Ganchos</div>`;sc.h.forEach(x=>h+=`<div class="hook">${x}</div>`);}
if(sc.nu) h+=`<div class="nudge">💡 <b>Si atascan:</b> ${sc.nu}</div>`;
if(sc.fa) h+=`<div class="fail">🔄 <b>Fail Forward:</b> ${sc.fa}</div>`;
h+=`<div class="mus">🎵 ${sc.m}</div>`;
h+=`</div></div>`;
});

else if(cat==="en") s.enemies.forEach(e=>{
h+=`<div class="card"><div class="card-h" onclick="tog(this)"><span>${e.n}</span><span class="arr">▼</span></div><div class="card-b">`;
h+=`<div style="margin-bottom:6px"><span class="tag">CA ${e.ac}</span><span class="tag">PG ${e.hp}</span></div>`;
h+=`<div style="margin-bottom:4px"><b>Ataque:</b> ${e.atk}</div>`;
h+=`<div style="margin-bottom:4px"><b>Especial:</b> ${e.sp}</div>`;
h+=`<div class="warn"><b>Tácticas:</b> ${e.tc}</div>`;
h+=`</div></div>`;
});

else if(cat==="np") s.npcs.forEach(n=>{
h+=`<div class="card"><div class="card-h" onclick="tog(this)"><span>${n.n} — <span style="color:#888;font-weight:400">${n.d}</span></span><span class="arr">▼</span></div><div class="card-b">`;
h+=`<div class="quote">"${n.l}"</div>`;
h+=`<div style="font-size:12px;color:#7a9ed4">🔒 ${n.sec}</div>`;
h+=`</div></div>`;
});

else if(cat==="pc") s.pcs.forEach(p=>{
h+=`<div class="card"><div class="card-h" onclick="tog(this)"><span>${p.n} · <span style="color:#888;font-weight:400">${p.c}</span></span><span class="arr">▼</span></div><div class="card-b">`;
h+=`<div style="margin-bottom:6px"><span class="tag b">PG ${p.hp}</span><span class="tag b">CA ${p.ac}</span></div>`;
h+=`<div style="margin-bottom:6px">${p.key}</div>`;
h+=`<div class="warn">⚠ ${p.w}</div>`;
h+=`</div></div>`;
});

else if(cat==="it") s.items.forEach(it=>{
h+=`<div class="card"><div class="card-h" onclick="tog(this)"><span>${it.n}</span><span class="arr">▼</span></div><div class="card-b">`;
h+=`<div style="margin-bottom:4px">${it.e}</div>`;
h+=`<div style="font-size:12px;color:#7a9ed4">${it.a}</div>`;
h+=`</div></div>`;
});

else if(cat==="mu") s.music.forEach(m=>{
h+=`<div class="row"><span class="l">${m.s}</span><span class="r">${m.t}</span></div>`;
});

$("#out").innerHTML=h;
// Auto-open first card
const first=$("#out .card-b");
if(first){first.classList.add("open");const a=first.previousElementSibling.querySelector(".arr");if(a)a.classList.add("open");}
}

function tog(el){
const b=el.nextElementSibling;
const a=el.querySelector(".arr");
b.classList.toggle("open");
a.classList.toggle("open");
}

function setSes(id){sid=id;cat="sc";renderNav();render();}
function setCat(id){cat=id;renderNav();render();}

function renderNav(){
let sh="";SE.forEach(s=>{sh+=`<button class="${s.id===sid?"on":""}" onclick="setSes('${s.id}')">${s.sh}<br><span style="font-size:9px;font-weight:400">${s.sub}</span></button>`;});
$("#sess").innerHTML=sh;
let ch="";CATS.forEach(c=>{ch+=`<button class="${c.id===cat?"on":""}" onclick="setCat('${c.id}')">${c.l}</button>`;});
$("#cats").innerHTML=ch;
}

renderNav();render();
</script>
