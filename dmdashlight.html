<title>DM Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#111;color:#e0ddd4;font-size:14px;line-height:1.5;padding-bottom:60px}
.hd{position:sticky;top:0;z-index:10;background:#111;border-bottom:1px solid #333;padding:8px 10px 6px}
.ss{display:flex;gap:4px;margin-bottom:6px}
.ss button{flex:1;padding:7px 2px;border-radius:8px;border:1px solid #444;background:none;color:#aaa;font-size:11px;cursor:pointer;text-align:center;line-height:1.3}
.ss button.on{border:2px solid #e0ddd4;background:#1a1a1a;color:#e0ddd4;font-weight:600}
.cs{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.cs button{padding:5px 9px;border-radius:16px;border:none;cursor:pointer;white-space:nowrap;font-size:11px;background:#222;color:#999}
.cs button.on{background:#e0ddd4;color:#111}
.ct{padding:8px 10px}
details{border-bottom:1px solid #222}
summary{padding:10px 0;font-size:13px;font-weight:500;cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▼";font-size:9px;color:#666}
details[open] summary::after{content:" ▲"}
.bd{padding:0 0 10px;font-size:12px;line-height:1.6;color:#b0ada4}
.qt{background:#1a1a1a;border-left:3px solid #555;border-radius:0 6px 6px 0;padding:8px 10px;margin-bottom:8px;font-style:italic;font-size:12px;color:#c8c4ba}
.tg{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:#222;color:#999;margin-right:3px}
.hk{font-size:11px;padding:2px 0;color:#b0ada4}
.hk::before{content:"- "}
.wr{font-size:11px;color:#d4a44a;font-style:italic;margin-top:3px}
.fl{font-size:11px;color:#7aaa7a;margin-top:3px}
.nd{font-size:11px;color:#7a9ed4;margin-top:3px}
.mu{font-size:10px;color:#666;margin-top:3px}
.sl{font-size:10px;font-weight:700;color:#888;margin:6px 0 3px;border-bottom:1px solid #333;padding-bottom:1px}
.rw{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1a1a1a;font-size:12px}
.rw .l{color:#999}.rw .r{font-weight:500;text-align:right;max-width:60%}
b{color:#e0ddd4}
</style>

{t:"Dilema",c:"No hay solucion buena:<br>- Matar Baron: libre pero ninos mueren<br>- Precio personal: todos libres, jugador marcado<br>- Engano: temporal, represalias<br>- Verdad a Mila: libre sin proteccion<br><br>Como DM: no juzgues. Narra consecuencias con honestidad."},

{id:"c",nm:"El Precio del Deseo",sh:"Deseo",sub:"4nov+1exp Nv3/5",
story:[
{t:"Resumen",c:"Lady Irina se convierte en cristal por maldicion del Maestro Espejo. Precio imposible por curar a su marido. Solucion: Djinn en Tor Vyrenn. Formular deseo con palabras exactas. Cada ambiguedad sera explotada."},
{t:"La verdad oculta",c:"Hace un ano Irina hizo trato: Maestro Espejo curo a su marido. Precio: lo que mas amara (su hija). Se nego. Maldicion.<br><br><b>Lo que Irina no sabe:</b> romper el trato mata al marido. Jugadores lo descubren con el Djinn. Ella no esta para decidir.<br><br><b>Maestro Espejo:</b> no es demonio ni dios. Transaccional. La maldicion es clausula de incumplimiento."},
{t:"Motivaciones NPCs",c:"<b>IRINA:</b> Culpa por haber hecho el trato. Autentica.<br><br><b>MAESTRO ESPEJO:</b> Observa por curiosidad. Regalos genuinos sin trampa inmediata. Pero ahora los conoce.<br><br><b>DJINN:</b> Furia milenaria. Concedera porque debe. Refleja palabras con precision de cuchilla.<br><br><b>MORTIMER:</b> Entusiasmo puro.<br><br><b>ASHA:</b> Miedo real."},
{t:"Flujo narrativo",c:"<b>E1 Irina:</b> Urgencia. Mujer de cristal.<br><b>E2 Investigacion:</b> Mortimer (tecnico) + Asha (practico). Cada ambiguedad sera explotada.<br><b>E3 Vestibulo:</b> Puzzle espejos. Reflejos = tema Maestro Espejo.<br><b>E4 Biblioteca:</b> Combate. Water Weird tactico.<br><b>E5 Camara:</b> Trampa. Simbolos CONEXION.<br><b>E6 Djinn:</b> CORAZON. Formular deseo.<br><b>E7 Maestro Espejo:</b> Conversacion. Regalos."},
{t:"Dilema",c:"La formulacion ES el dilema:<br>- Maldicion desaparezca = sintoma, vuelve manana<br>- Trato anulado = funciona, marido muere<br>- Libre para siempre = mejor, marido muere<br>- Deseo egoista = Irina muere<br><br>Dilema real: matar al marido para salvarla. Ella no consiente.<br><br>Despues: regalos Maestro Espejo al deseo mas profundo de cada PJ."},
{t:"Conexion 3 sesiones",c:"<b>Camara del Sello:</b> Los 3 simbolos de la losa (Sesion A) en las paredes, mas antiguos que la torre.<br><br><b>Post-sesiones:</b> Mesa A simbolos en tumba. Mesa B reconoce pantano. Mesa C mismos en torre. Descubrimiento ocurre solo."},
{t:"Finales posibles",c:"<b>Agridulce:</b> Libre para siempre. Marido muere. 500po + Capa.<br><b>Parcial:</b> Maldicion desaparezca. Vuelve manana.<br><b>Tragico:</b> Deseo egoista. Irina cristal. 200po.<br><b>Honorable:</b> Trato anulado. Si Irina decide en vivo: muy poderoso."}
],

function $(s){return document.querySelector(s)}

function nav(){
var h="";
for(var i=0;i<SE.length;i++){var s=SE[i];h+='<button class="'+(s.id===sid?"on":"")+'" onclick="go(\''+s.id+'\')">'+s.sh+'<br><span style="font-size:9px;font-weight:400">'+s.sub+'</span></button>';}
$("#ss").innerHTML=h;
var c="";
for(var i=0;i<CATS.length;i++){var ct=CATS[i];c+='<button class="'+(ct.id===cat?"on":"")+'" onclick="sw(\''+ct.id+'\')">'+ct.l+'</button>';}
$("#cs").innerHTML=c;
}

function go(id){sid=id;cat="tr";nav();ren();}
function sw(id){cat=id;nav();ren();}

function ren(){
var s=null;
for(var i=0;i<SE.length;i++){if(SE[i].id===sid){s=SE[i];break;}}
if(!s){$("#out").innerHTML="Error";return;}
var h="";

if(cat==="tr"&&s.story){
for(var i=0;i<s.story.length;i++){var st=s.story[i];
h+='<details'+(i===0?' open':'')+'><summary>'+st.t+'</summary><div class="bd">'+st.c+'</div></details>';
}
}
else if(cat==="sc"&&s.scenes){
for(var i=0;i<s.scenes.length;i++){var sc=s.scenes[i];
h+='<details'+(i===0?' open':'')+'><summary>'+sc.t+'</summary><div class="bd">';
h+='<div class="qt">'+sc.o+'</div>';
h+='<div style="margin-bottom:6px">'+sc.s+'</div>';
if(sc.d&&sc.d.length>0){for(var j=0;j<sc.d.length;j++){h+='<div class="hk">'+sc.d[j]+'</div>';}}
if(sc.h&&sc.h.length>0){h+='<div class="sl">Ganchos</div>';for(var j=0;j<sc.h.length;j++){h+='<div class="hk">'+sc.h[j]+'</div>';}}
if(sc.nu){h+='<div class="nd">Si atascan: '+sc.nu+'</div>';}
if(sc.fa){h+='<div class="fl">Fail Forward: '+sc.fa+'</div>';}
if(sc.m){h+='<div class="mu">Musica: '+sc.m+'</div>';}
h+='</div></details>';
}
}
else if(cat==="en"&&s.enemies){
for(var i=0;i<s.enemies.length;i++){var e=s.enemies[i];
h+='<details'+(i===0?' open':'')+'><summary>'+e.n+'</summary><div class="bd">';
h+='<span class="tg">CA '+e.ac+'</span><span class="tg">PG '+e.hp+'</span><br>';
h+='<b>Ataque:</b> '+e.at+'<br>';
h+='<b>Especial:</b> '+e.sp+'<br>';
h+='<div class="wr">Tacticas: '+e.tc+'</div>';
h+='</div></details>';
}
}
else if(cat==="np"&&s.npcs){
for(var i=0;i<s.npcs.length;i++){var n=s.npcs[i];
h+='<details><summary>'+n.n+' - '+n.d+'</summary><div class="bd">';
h+='<div class="qt">'+n.l+'</div>';
h+='<div style="color:#7a9ed4;font-size:11px">'+n.sc+'</div>';
h+='</div></details>';
}
}
else if(cat==="pc"&&s.pcs){
for(var i=0;i<s.pcs.length;i++){var p=s.pcs[i];
h+='<details'+(i===0?' open':'')+'><summary>'+p.n+' - '+p.c+'</summary><div class="bd">';
h+='<span class="tg">PG '+p.hp+'</span><span class="tg">CA '+p.ac+'</span><br>';
h+='<div style="margin:4px 0">'+p.k+'</div>';
h+='<div class="wr">'+p.w+'</div>';
h+='</div></details>';
}
}
else if(cat==="it"&&s.items){
for(var i=0;i<s.items.length;i++){var it=s.items[i];
h+='<details><summary>'+it.n+'</summary><div class="bd">'+it.e+'<br><span style="color:#7a9ed4">'+it.a+'</span></div></details>';
}
}
else if(cat==="mu"&&s.music){
for(var i=0;i<s.music.length;i++){var m=s.music[i];
h+='<div class="rw"><span class="l">'+m.s+'</span><span class="r">'+m.t+'</span></div>';
}
}

$("#out").innerHTML=h;
}

nav();ren();
</script>
