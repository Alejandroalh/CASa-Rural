<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Personaje D&D</title>
<style>
:root{--bg:#0f1117;--s1:#1a1d27;--s2:#222635;--ink:#e8e9ed;--ink2:#9ca0af;--ink3:#6b7084;--brd:#2d3143;--acc:#60a5fa;--red:#f87171;--grn:#4ade80;--amb:#fbbf24;--sa:#c084fc;--sb:#34d399;--sc:#f472b6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
::selection{background:var(--acc);color:var(--bg)}
.app{max-width:520px;margin:0 auto;padding:0 0 80px}

/* PICK SCREEN */
.pick{padding:20px 16px}
.pick h1{font-size:1.3rem;font-weight:700;text-align:center;color:var(--acc);margin-bottom:2px;letter-spacing:-.3px}
.pick .sub{text-align:center;font-size:.78rem;color:var(--ink3);margin-bottom:20px}
.grp{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);padding:14px 0 8px;border-bottom:1px solid var(--brd);margin-top:6px}
.pc{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border:1px solid var(--brd);border-radius:10px;margin:6px 0;background:var(--s1);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,transform .1s;animation:fadeUp .25s ease both}
.pc:active{transform:scale(.98);border-color:#4a5068}
.pc .nm{font-size:.95rem;font-weight:600;color:var(--ink)}.pc .cl{font-size:.78rem;color:var(--ink2);margin-top:1px}.pc .rc{font-size:.7rem;color:var(--ink3);margin-top:1px}
.pc .ri{text-align:right;font-size:.78rem;color:var(--ink3);flex-shrink:0}
.exp-badge{font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:4px;color:var(--amb);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2);margin-left:5px;vertical-align:middle}

/* SHEET */
.sheet{padding:0 16px}
.back{display:flex;align-items:center;gap:4px;background:none;border:none;color:var(--ink2);font-size:.82rem;padding:14px 0;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.back:active{color:var(--acc)}
.nm2{font-size:1.4rem;font-weight:700;color:var(--ink);letter-spacing:-.3px}
.ti2{font-size:.92rem;color:var(--ink2);margin-top:2px}
.me2{font-size:.78rem;color:var(--ink3);margin-bottom:14px;margin-top:2px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--brd);margin-bottom:14px;position:sticky;top:0;z-index:10;background:var(--bg);padding-top:6px}
.tabs button{flex:1;padding:10px 4px;border:none;background:none;color:var(--ink3);font-size:.88rem;font-family:inherit;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;-webkit-tap-highlight-color:transparent}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--acc)}

/* QUICK START */
.qs{background:var(--s1);border:1px solid var(--brd);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:14px;font-size:.82rem;line-height:1.65;color:var(--ink2)}
.qs b{display:block;font-size:.68rem;font-weight:700;color:var(--ink3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}

/* HP */
.hprow{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--s1);border:1px solid var(--brd);border-radius:10px;margin-bottom:12px}
.hprow .lb{font-size:.78rem;color:var(--ink3);font-weight:600}
.hprow .vl{font-size:1.5rem;font-weight:700;min-width:50px;text-align:center}
.hprow .mx{font-size:.78rem;color:var(--ink3)}
.b1{width:36px;height:36px;border-radius:8px;border:1px solid var(--brd);background:var(--s2);color:var(--ink);font-size:1.1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:background .1s}
.b1:active{background:#3a3e52}
.bsm{width:22px;height:22px;border-radius:6px;border:1px solid var(--brd);background:var(--s2);color:var(--ink);font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
.bt{border:1px solid var(--brd);background:transparent;color:var(--ink2);padding:4px 10px;border-radius:6px;font-size:.7rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.bt:active{border-color:var(--acc);color:var(--acc)}

/* STATS GRID */
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0}
.si{background:var(--s1);border:1px solid var(--brd);border-radius:8px;padding:6px 2px;text-align:center}
.si .sl{font-size:.6rem;font-weight:700;color:var(--ink3);letter-spacing:.5px}.si .sv{font-size:1.1rem;font-weight:700;color:var(--ink)}.si .sm{font-size:.78rem;color:var(--ink2)}

/* INFO ROW */
.i3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.i3 div{background:var(--s1);border:1px solid var(--brd);border-radius:8px;padding:8px 10px}
.i3 .il{font-size:.6rem;font-weight:700;color:var(--ink3);letter-spacing:.3px;text-transform:uppercase}.i3 .iv{font-size:1rem;font-weight:700;margin-top:2px}.i3 .id{font-size:.65rem;color:var(--ink3);margin-top:1px}

.skl{font-size:.78rem;color:var(--ink2);margin:6px 0;line-height:1.5}
.skl strong{color:var(--ink3);font-weight:600}
.sn{font-size:.65rem;color:var(--ink3);margin-bottom:8px}

/* CARDS */
.card{background:var(--s1);border:1px solid var(--brd);border-radius:10px;margin-bottom:8px;overflow:hidden;transition:border-color .15s;animation:fadeUp .2s ease both}
.card:active{border-color:#4a5068}
.card-h{padding:12px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;-webkit-tap-highlight-color:transparent}
.card-h .tl{font-size:.88rem;font-weight:600;color:var(--ink);flex:1}
.card-h .arr{font-size:.6rem;color:var(--ink3);transition:transform .2s;flex-shrink:0}
.card.open .card-h .arr{transform:rotate(180deg)}
.card-bd{display:none;padding:0 14px 12px;font-size:.82rem;color:var(--ink2);line-height:1.65}
.card.open .card-bd{display:block}

/* ATTACKS */
.atkr{padding:8px 0;border-bottom:1px solid var(--brd)}
.atkr:last-child{border:none}
.atkr .rw{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:.82rem}
.atkr .rw b{color:var(--ink)}.atkr .rw span{color:var(--ink2)}
.atkr .nt{font-size:.72rem;color:var(--ink3);margin-top:1px}

/* SLOTS */
.slt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;margin-bottom:6px}
.slg{display:flex;align-items:center;gap:4px}
.slg .ll{font-size:.7rem;color:var(--ink3);font-weight:600}
.dot{width:26px;height:26px;border-radius:13px;border:2px solid var(--brd);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--ink3);font-family:inherit;-webkit-tap-highlight-color:transparent;transition:all .15s}
.dot.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}

.spcat{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin:8px 0 3px}
.spl{font-size:.78rem;padding:3px 0;line-height:1.5;color:var(--ink2)}

/* FEATURES */
.ft{padding:8px 0;border-bottom:1px solid var(--brd)}
.ft:last-child{border:none}
.ft .fn{font-size:.85rem;font-weight:600;color:var(--ink)}
.ft .fd{font-size:.78rem;color:var(--ink2);line-height:1.55;white-space:pre-line;margin-top:2px}
.uses{display:inline-flex;align-items:center;gap:3px;margin-left:6px;vertical-align:middle}
.uv{font-size:.78rem;font-weight:700}

/* CONSUMABLES */
.cn{padding:8px 0;border-bottom:1px solid var(--brd)}
.cn:last-child{border:none}
.cn .cnn{font-size:.85rem;font-weight:600;color:var(--ink)}
.cn .cnd{font-size:.78rem;color:var(--ink2);margin-top:1px}
.cn .cna{font-size:.72rem;color:var(--acc);margin-top:3px}

/* ROLEPLAY */
.rpq{font-size:.92rem;font-style:italic;color:var(--ink2);line-height:1.55;margin-bottom:8px;padding:10px 12px;background:var(--s2);border-radius:6px;border-left:3px solid var(--acc)}
.rpd{font-size:.82rem;color:var(--ink2);margin-bottom:8px}
.rpe{font-size:.75rem;color:var(--ink3)}

.tag{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.3px;color:var(--acc);background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.15)}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>

var SNAMES=[{s:1,l:"Sesion 1 — Pantanovago",d:"Nivel 3"},{s:2,l:"Sesion 2 — El Precio del Deseo",d:"Nivel 3/5"},{s:3,l:"El Rey Bajo la Colina",d:"Nivel 2"}];
var REF=[{t:"Tu turno",c:"1. MOVERTE (hasta velocidad)\n2. UNA ACCION (atacar, conjuro, esquivar, ayudar, esconderte, dash, desenganche, objeto)\n3. ACCION BONUS (si clase lo permite)\n\n+ UNA REACCION por ronda (fuera de turno)"},{t:"Atacar",c:"d20 + bonificador ataque\nSi resultado >= CA = impactas\nTira dano + modificador\n\nNat 20 = CRITICO (doble dados)\nNat 1 = FALLO"},{t:"Salvaciones",c:"DM pide (ej: DES CD14)\nd20 + modificador salvacion\n>= CD = la pasas"},{t:"Ventaja / Desventaja",c:"VENTAJA: 2d20, el mas alto\nDESVENTAJA: 2d20, el mas bajo\nAmbas = normal"},{t:"Conjuros",c:"TRUCOS: gratis, ilimitados\nCONJUROS: gastan espacio. Recuperas desc.largo\nCONCENTRACION: solo 1 a la vez. Si dano: CON CD10 o pierdes"},{t:"Caer a 0 PG",c:"Inconsciente. Cada turno d20:\n10+ = exito  |  9- = fallo\nNat20 = 1PG  |  Nat1 = 2 fallos\n3 exitos = estable  |  3 fallos = mueres\nCuracion = despiertas"},{t:"Descansos",c:"CORTO (1h): dados de golpe para curarte\nLARGO (8h): todo PG + espacios"},{t:"Estados",c:"ASUSTADO: desventaja, no acercarte\nDERRIBADO: gatear, desventaja, CaC ventaja\nAGARRADO: vel.0, escapar Atletismo/Acrobacia\nENVENENADO: desventaja ataques+pruebas"}];

var sel=null,tab=0,hpV={},slotV={},useV={},poolV={};
var app=document.getElementById("app");

function showPick(){
sel=null;
var h='<div class="pick"><h1>Elige tu personaje</h1><p class="sub">Casa Rural D&D · Toca el tuyo</p>';
for(var g=0;g<SNAMES.length;g++){var sn=SNAMES[g];
h+='<div class="grp">'+sn.l+' · '+sn.d+'</div>';
for(var i=0;i<C.length;i++){if(C[i].s!==sn.s)continue;var c=C[i];
h+='<div class="pc" onclick="pickChar('+i+')" style="animation-delay:'+Math.min(i*25,200)+'ms"><div><div class="nm">'+c.n+(c.ex?'<span class="exp-badge">NIVEL 5</span>':'')+'</div><div class="cl">'+c.t+'</div><div class="rc">'+c.r+' · '+c.c+'</div></div><div class="ri">CA '+c.ac+'<br>PG '+c.hp+'</div></div>';}}
h+='</div>';app.innerHTML=h;}

function pickChar(i){sel=i;tab=0;if(hpV[i]===undefined)hpV[i]=C[i].hp;showSheet();}

function tog(el){el.closest('.card').classList.toggle('open');}

function showSheet(){
var c=C[sel];var mods=[];for(var i=0;i<6;i++)mods.push(Math.floor((c.st[i]-10)/2));
var hp=hpV[sel];var hcl=hp<=c.hp*0.25?'var(--red)':hp<=c.hp*0.5?'var(--amb)':'var(--ink)';

var h='<div class="sheet"><button class="back" onclick="showPick()">← Cambiar personaje</button>';
h+='<div class="nm2">'+c.n+'</div><div class="ti2">'+c.t+'</div><div class="me2">'+c.r+' · '+c.c+' · '+c.su+'</div>';
h+='<div class="tabs"><button class="'+(tab===0?'on':'')+'" onclick="tab=0;showSheet()">Personaje</button><button class="'+(tab===1?'on':'')+'" onclick="tab=1;showSheet()">Referencia</button></div>';

if(tab===0){
h+='<div class="qs"><b>Inicio rapido</b>'+c.q+'</div>';
h+='<div class="hprow"><span class="lb">PG</span><button class="b1" onclick="adjHP(-1)">−</button><span class="vl" style="color:'+hcl+'">'+hp+'</span><button class="b1" onclick="adjHP(1)">+</button><span class="mx">/ '+c.hp+'</span><button class="bt" onclick="hpV[sel]=C[sel].hp;showSheet()">MAX</button></div>';
h+='<div class="sg">';for(var i=0;i<6;i++)h+='<div class="si"><div class="sl">'+SN[i]+'</div><div class="sv">'+c.st[i]+'</div><div class="sm">'+(mods[i]>=0?'+':'')+mods[i]+'</div></div>';h+='</div>';
h+='<div class="i3"><div><div class="il">CA</div><div class="iv">'+c.ac+'</div><div class="id">'+c.acd+'</div></div><div><div class="il">Velocidad</div><div class="iv">'+c.spd+'p</div></div><div><div class="il">Competencia</div><div class="iv">+'+c.pr+'</div></div></div>';
h+='<div class="skl"><strong>Salvaciones:</strong> '+c.sv.join(', ')+'</div>';
h+='<div class="skl"><strong>Habilidades:</strong> '+c.sk.join(', ')+'</div>';
var hasE=false;for(var j=0;j<c.sk.length;j++)if(c.sk[j].indexOf('*')!==-1)hasE=true;
if(hasE)h+='<div class="sn">* = Experto (doble competencia)</div>';

h+=mkCard("Ataques",true,function(){var r="";for(var i=0;i<c.at.length;i++){var a=c.at[i];r+='<div class="atkr"><div class="rw"><b>'+a.n+'</b><span>'+a.h+' | '+a.d+'</span></div>'+(a.t?'<div class="nt">'+a.t+'</div>':'')+'</div>';}return r;});

if(c.sp){h+=mkCard("Conjuros",true,function(){
var r='<div style="font-size:.78rem;margin-bottom:6px"><strong style="color:var(--ink3)">CD:</strong> '+c.sp.dc+' <strong style="color:var(--ink3);margin-left:10px">Ataque:</strong> '+c.sp.ak+'</div>';
r+=renderSlots(sel,c.sp.sl);
if(c.sp.ca&&c.sp.ca.length>0){r+='<div class="spcat">Trucos (ilimitados)</div>';for(var i=0;i<c.sp.ca.length;i++)r+='<div class="spl">'+c.sp.ca[i]+'</div>';}
if(c.sp.al&&c.sp.al.length>0){r+='<div class="spcat">Siempre preparados</div>';for(var i=0;i<c.sp.al.length;i++)r+='<div class="spl">'+c.sp.al[i]+'</div>';}
if(c.sp.pr&&c.sp.pr.length>0){r+='<div class="spcat">'+((c.sp.al&&c.sp.al.length>0)?'Preparados':'Conocidos')+'</div>';for(var i=0;i<c.sp.pr.length;i++)r+='<div class="spl">'+c.sp.pr[i]+'</div>';}
return r;});}

h+=mkCard("Rasgos y habilidades",false,function(){var r="";for(var i=0;i<c.fe.length;i++){var f=c.fe[i];
r+='<div class="ft"><div style="display:flex;align-items:center;flex-wrap:wrap"><span class="fn">'+f.n+'</span>';
if(f.u!==undefined){var k=sel+'u'+i;if(useV[k]===undefined)useV[k]=f.u;r+=renderUses(k,f.u);}
if(f.p!==undefined){var k=sel+'p'+i;if(poolV[k]===undefined)poolV[k]=f.p;r+=renderPool(k,f.p);}
r+='</div><div class="fd">'+f.d+'</div></div>';}return r;});

h+=mkCard("Consumibles",true,function(){var r="";for(var i=0;i<c.co.length;i++){var x=c.co[i];r+='<div class="cn"><div class="cnn">'+x.n+'</div><div class="cnd">'+x.d+'</div><div class="cna">'+x.a+'</div></div>';}return r;});

h+=mkCard("Roleplay y equipo",false,function(){return '<div class="rpq">"'+c.qu+'"</div><div class="rpd">'+c.rp+'</div><div class="rpe">'+c.eq+'</div>';});

}else{
for(var i=0;i<REF.length;i++){var r=REF[i];
h+=mkCard(r.t,i===0,function(idx){return function(){return '<div style="white-space:pre-line;font-size:.82rem;color:var(--ink2);line-height:1.65">'+REF[idx].c+'</div>';};}(i));}
}
h+='</div>';app.innerHTML=h;window.scrollTo(0,0);}

function mkCard(title,open,contentFn){
return '<div class="card'+(open?' open':'')+'" style="animation:fadeUp .2s ease both"><div class="card-h" onclick="tog(this)"><span class="tl">'+title+'</span><span class="arr">▼</span></div><div class="card-bd">'+contentFn()+'</div></div>';}

function adjHP(d){hpV[sel]=Math.max(0,Math.min(C[sel].hp,hpV[sel]+d));showSheet();}

function renderSlots(ci,sl){
if(!slotV[ci]){slotV[ci]=[];for(var l=0;l<sl.length;l++){slotV[ci][l]=[];for(var j=0;j<sl[l];j++)slotV[ci][l].push(false);}}
var h='<div class="slt">';
for(var l=0;l<sl.length;l++){h+='<div class="slg"><span class="ll">Nv.'+(l+1)+':</span>';
for(var j=0;j<sl[l];j++){var on=slotV[ci][l][j];h+='<button class="dot'+(on?' on':'')+'" onclick="togSlot('+ci+','+l+','+j+')">'+(on?'✕':'')+'</button>';}h+='</div>';}
h+='<button class="bt" onclick="rstSlots('+ci+')">REST</button></div>';return h;}
function togSlot(ci,l,j){slotV[ci][l][j]=!slotV[ci][l][j];showSheet();}
function rstSlots(ci){var sl=C[ci].sp.sl;slotV[ci]=[];for(var l=0;l<sl.length;l++){slotV[ci][l]=[];for(var j=0;j<sl[l];j++)slotV[ci][l].push(false);}showSheet();}

function renderUses(k,max){var v=useV[k];return '<span class="uses"><button class="bsm" onclick="adjUse(\''+k+'\',-1,'+max+')">−</button><span class="uv" style="color:'+(v===0?'var(--red)':'var(--ink)')+'">'+v+'/'+max+'</span><button class="bsm" onclick="adjUse(\''+k+'\',1,'+max+')">+</button></span>';}
function adjUse(k,d,max){useV[k]=Math.max(0,Math.min(max,useV[k]+d));showSheet();}

function renderPool(k,max){var v=poolV[k];return '<span class="uses" style="margin-left:6px"><span style="font-size:.65rem;color:var(--ink3)">Reserva:</span><button class="bsm" onclick="adjPool(\''+k+'\',-1,'+max+')">−</button><span class="uv" style="color:'+(v===0?'var(--red)':'var(--ink)')+'">'+v+'</span><button class="bsm" onclick="adjPool(\''+k+'\',1,'+max+')">+</button></span>';}
function adjPool(k,d,max){poolV[k]=Math.max(0,Math.min(max,poolV[k]+d));showSheet();}

try{showPick();}catch(e){app.innerHTML='<div style="padding:20px;color:var(--red)">Error: '+e.message+'</div>';}
</script>
